<title>Capital Kranti Website</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gujarati:wght@400;600;700;800&family=Hind+Vadodara:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: the Washington Post's UI (measured 24 Oct 2026) -- a 20-column grid (34px columns, 32px gutters, 1288px),
   1px rules drawn in the middle of each gutter, 15+5 front block and rail, section bands in pairs; articles in one 640px column.
   Dark first (the paper's choice); Light and Match-device from the account panel. */
:root{
  --bg:#141414; --panel:#1c1c1c; --ink:#dedede; --strong:#ffffff; --soft:#bdbdbd; --muted:#a1a1a1;
  --rule:#2a2a2a; --rule-strong:#5a5a5a; --hover:#9a9a9a; --chip:#2b2b2b;
  --blue:#166dfc; --live:#5892c9; --breaking:#f1554f; --opinion:#d4524d; --badge-bg:#ffffff; --badge-ink:#111111;
  --serif:'Noto Serif Gujarati','Gujarati Sangam MN',Georgia,serif;
  --sans:'Hind Vadodara','Gujarati MT','Helvetica Neue',Arial,sans-serif;
  --gut:32px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ffffff; --panel:#f5f5f5; --ink:#2a2a2a; --strong:#111111; --soft:#4d4d4d; --muted:#666666;
  --rule:#e9e9e9; --rule-strong:#a1a1a1; --hover:#666666; --chip:#efefef; --badge-bg:#111111; --badge-ink:#ffffff; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#ffffff; --panel:#f5f5f5; --ink:#2a2a2a; --strong:#111111; --soft:#4d4d4d; --muted:#666666;
  --rule:#e9e9e9; --rule-strong:#a1a1a1; --hover:#666666; --chip:#efefef; --badge-bg:#111111; --badge-ink:#ffffff; color-scheme:light }
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.3;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--live);outline-offset:3px;border-radius:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:calc(1288px + 32px);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.icons{display:flex;gap:6px;align-items:center}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--strong)}
.ibtn:hover{background:var(--chip)}
.dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--breaking)}
.mini{text-align:center;line-height:1.05;opacity:0;transition:opacity .2s;pointer-events:none}
.stuck .mini{opacity:1;pointer-events:auto}
.mini b{display:block;font-family:var(--serif);font-weight:800;font-size:22px;color:var(--strong)}
.mini i{font-family:var(--serif);font-size:11px;color:var(--muted)}
.right{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.pill{background:var(--blue);color:#fff;border-radius:999px;padding:7px 16px;font-size:15px;font-weight:700}
.pill:hover{filter:brightness(.88)}
.acct{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--strong);padding:6px 8px;border-radius:999px}
.acct:hover{background:var(--chip)}
.trend-bar{display:none;border-top:1px solid var(--rule)}.stuck .trend-bar{display:block}

.breaking{background:var(--breaking);color:#fff}
.breaking .wrap{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;position:relative;font-size:15px;padding-block:8px}
.breaking b{font-weight:800}.breaking a:hover{text-decoration:underline}
.breaking .x{position:absolute;right:max(16px,env(safe-area-inset-right,0px));color:#fff}

.mast{text-align:center;padding-block:28px 16px}
.mast h1{font-family:var(--serif);font-weight:800;font-size:clamp(40px,6vw,66px);line-height:1.15;margin:0;color:var(--strong);letter-spacing:.5px}
.mast p{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);margin:4px 0 0}
nav.secs{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 30px;padding-block:16px 15px;border-bottom:1px solid var(--ink);font-weight:700;font-size:15px;color:var(--strong)}
nav.secs .sep{width:1px;background:var(--rule-strong);align-self:stretch}
nav.secs button:hover{color:var(--hover)}nav.secs button.on{box-shadow:inset 0 -2px 0 var(--strong)}
.trending{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;padding-block:13px;font-size:14px;color:var(--soft)}
.trending b{color:var(--strong)}.trending button:hover{text-decoration:underline}

/* ---------- panels: drawer (left), alerts, account (right) ---------- */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--bg);border-right:1px solid var(--rule);z-index:41;overflow:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) 22px 30px calc(22px + env(safe-area-inset-left,0px))}
.drawer .pill{display:block;text-align:center;margin-bottom:16px}
.ask{display:flex;align-items:center;border:1px solid var(--rule-strong);border-radius:4px;padding:0 10px;margin-bottom:18px}
.ask input{flex:1;min-width:0;background:none;border:0;color:var(--strong);padding:11px 0;font:inherit;font-size:15px;outline:none}
.drawer .row{display:flex;justify-content:space-between;align-items:center;width:100%;padding-block:11px;font-weight:700;font-size:15px;color:var(--strong)}
.drawer .row:hover{color:var(--hover)}
.drawer .sub{padding:0 0 8px 14px}.drawer .sub button{display:block;padding-block:7px;font-size:14px;color:var(--soft)}
.drawer .sub button:hover{color:var(--strong)}
.drawer .chev{transition:transform .2s}.drawer .open .chev{transform:rotate(90deg)}
.drawer h6{font-size:12px;letter-spacing:1px;color:var(--muted);margin:22px 0 6px;font-weight:700;border-top:1px solid var(--rule);padding-top:18px}
.drawer .az button{display:block;padding-block:6px;font-size:14px;color:var(--soft)}.drawer .az button:hover{color:var(--strong)}
.pop{position:fixed;z-index:41;background:var(--bg);border:1px solid var(--rule);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.alerts{top:calc(56px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(360px,92vw);max-height:70vh;overflow:auto;padding:14px 18px}
.alerts header{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;letter-spacing:.8px;color:var(--strong);padding-bottom:8px}
.alert{display:grid;grid-template-columns:10px 1fr;gap:8px;padding-block:12px;border-top:1px solid var(--rule)}
.alert .d{width:7px;height:7px;border-radius:50%;background:var(--breaking);margin-top:8px}.alert .d.seen{background:transparent}
.alert b{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.45;color:var(--strong);display:block}
.alert small{font-size:12.5px;color:var(--muted)}.alert small em{font-style:normal;color:var(--breaking);font-weight:700}
.account{top:0;right:0;bottom:0;width:min(320px,88vw);padding:calc(26px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-right,0px)) 24px 24px;border-width:0 0 0 1px;overflow:auto}
.account .name{font-family:var(--serif);font-weight:700;font-size:21px;color:var(--strong);text-align:center}
.account .pill{display:block;text-align:center;margin:12px auto 22px;width:max-content}
.account a.li{display:block;padding-block:12px;border-top:1px solid var(--rule);font-weight:700;font-size:15px;color:var(--strong)}
.account a.li small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.account a.li:hover{color:var(--hover)}
.theme{border-top:1px solid var(--rule);padding-top:16px;margin-top:6px}
.theme b{display:block;font-size:14px;color:var(--strong);margin-bottom:8px}
.theme label{display:flex;align-items:center;gap:10px;padding-block:6px;font-size:15px;cursor:pointer}
.theme input{accent-color:var(--blue);width:16px;height:16px}

/* ---------- grid and rules ---------- */
main{padding-block:30px 40px}
.grid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));column-gap:var(--gut);row-gap:var(--gut)}
.in15{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));column-gap:var(--gut);row-gap:var(--gut);align-content:start}
.in10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));column-gap:var(--gut);row-gap:var(--gut);align-content:start}
.c{position:relative;min-width:0}
.vr::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--gut) / -2);border-left:1px solid var(--rule)}
.hr::after{content:"";position:absolute;left:calc(var(--gut) / -2);right:calc(var(--gut) / -2);top:calc(var(--gut) / -2);border-top:1px solid var(--rule)}
.hr.flush::after{left:0;right:0}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s10{grid-column:span 10}.s12{grid-column:span 12}.s15{grid-column:span 15}.s20{grid-column:span 20}
.block{margin-top:64px}
.bandhead{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--rule-strong);padding-top:14px;margin-bottom:18px}
.bandhead > button,.bandhead > span{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:16px;color:var(--strong)}
.bandhead > button:hover{color:var(--hover)}
.bandhead svg.i{width:15px;height:15px;stroke-width:2.2}

/* ---------- type ---------- */
.kicker{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:16px;color:var(--strong);margin-bottom:12px}
.kicker svg.i{width:15px;height:15px;stroke-width:2.2}
.label{font-size:13px;color:var(--muted);margin-bottom:6px}.label b{color:var(--strong);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--badge-bg);color:var(--badge-ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:11.5px;letter-spacing:.4px;margin-bottom:10px}
.h-xl{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.32;color:var(--strong);margin:0 0 10px;text-wrap:balance}
.h-l{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.38;color:var(--strong);margin:0;text-wrap:balance}
.h-m{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.45;color:var(--strong);margin:0;text-wrap:balance}
.dek{font-weight:300;font-size:16px;line-height:1.55;color:var(--ink);margin:0 0 10px}
.by{font-size:14px;color:var(--muted);margin:0}.by .t::before{content:"•";margin:0 6px}
.cap{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.ph{width:100%;max-width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--chip)}
a.h:hover .h-xl,a.h:hover .h-l,a.h:hover .h-m,a.h:hover.h-m,.list a:hover,.op:hover .t,.most a:hover,.rel a:hover{color:var(--hover)}
.rel{margin-top:16px}.rel a{display:block;font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.45;color:var(--strong);padding-block:12px;border-top:1px solid var(--rule)}
.listen{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--strong);margin-top:10px}
.listen .pb{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule-strong);display:grid;place-items:center}
.listen .pb svg{width:12px;height:12px;fill:var(--strong);stroke:none}
.listen span.m{color:var(--muted);font-weight:400}

/* live carousel */
.live .head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.live .head .ttl{font-family:var(--serif);font-weight:800;font-size:22px;color:var(--strong)}
.lv{border:1px solid var(--live);color:var(--live);font-weight:700;font-size:12.5px;border-radius:5px;padding:1px 7px;display:inline-flex;align-items:center;gap:5px}
.lv::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.live .head .d{color:var(--muted);font-size:15px;flex:1}
.arrows{display:flex;gap:8px}.arrows button{width:32px;height:32px;border-radius:50%;border:1px solid var(--rule-strong);display:grid;place-items:center;color:var(--strong)}
.arrows button:hover{background:var(--chip)}.arrows button:disabled{opacity:.35;cursor:default}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3 * var(--gut)) / 4);column-gap:var(--gut);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track > *{scroll-snap-align:start;position:relative;min-width:0}
.track > * + *::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--gut) / -2);border-left:1px solid var(--rule)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--strong);margin-bottom:8px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.who em{font-style:normal;color:var(--live);font-size:13px}.new{color:var(--live);font-weight:700;font-size:13px}

/* rail */
.railh{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:16px;color:var(--strong);text-decoration:underline;text-decoration-color:var(--opinion);text-decoration-thickness:2px;text-underline-offset:6px;margin-bottom:6px}
.op{display:grid;grid-template-columns:1fr auto;gap:12px;padding-block:14px;border-bottom:1px solid var(--rule)}
.op .w{font-size:14px;color:var(--soft);margin-bottom:4px}
.op .t{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.42;color:var(--strong)}
.op img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.op small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.most ol{list-style:none;margin:0;padding:0;counter-reset:n}
.most li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;padding-block:12px;border-bottom:1px solid var(--rule)}
.most li::before{content:counter(n);font-family:var(--serif);font-weight:700;font-size:26px;color:var(--strong);line-height:1}
.most a{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.45;color:var(--strong)}
.list a{display:block;font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.45;color:var(--strong);padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--rule)}
.list a:last-child{border:0;margin:0;padding:0}
.time{font-size:13px;color:var(--muted);margin-top:6px;display:block}

/* video strip (9:16) */
.vtrack{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 5 * 14px) / 6);column-gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.vtrack::-webkit-scrollbar{display:none}
.vt{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;scroll-snap-align:start;background:var(--chip)}
.vt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.85))}
.vt .cap2{position:absolute;left:12px;right:12px;bottom:34px;z-index:1;font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.4;color:#fff}
.vt .dur{position:absolute;left:12px;bottom:12px;z-index:1;color:#fff;font-size:12.5px;display:flex;align-items:center;gap:5px}
.vt .dur svg{width:10px;height:10px;fill:#fff}
.vt .tag{position:absolute;left:12px;top:12px;z-index:1;color:#fff;font-size:11px;font-weight:800;letter-spacing:.6px}
.vt:hover img{transform:scale(1.03);transition:transform .3s}
.watch{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--strong)}

/* promo boxes */
.promo{border:1px solid var(--rule);padding:18px;text-align:center}
.promo .tags{display:inline-flex;border:1px solid var(--strong);font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--strong)}
.promo .tags span{padding:2px 8px}.promo .tags span+span{border-left:1px solid var(--strong)}
.promo h5{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--strong);margin:12px 0 6px}
.promo p{font-size:14px;color:var(--soft);line-height:1.55;margin:0 0 14px}
.promo .join{display:inline-block;border:1px solid var(--strong);border-radius:999px;padding:7px 18px;font-weight:700;font-size:14px;color:var(--strong)}
.promo .join:hover{background:var(--strong);color:var(--bg)}

/* footer */
footer{border-top:1px solid var(--rule);margin-top:64px;padding-block:34px 40px}
footer .wm{font-family:var(--serif);font-weight:800;font-size:26px;color:var(--strong)}
.fcols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px;margin-top:22px}
.fcols b{display:block;font-size:13px;color:var(--strong);margin-bottom:10px}
.fcols a{display:block;font-size:13px;color:var(--soft);padding-block:4px}.fcols a:hover{text-decoration:underline;color:var(--strong)}
.copy{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px}

/* section page */
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sechead h2{font-family:var(--sans);font-weight:700;font-size:clamp(34px,5vw,48px);color:var(--strong);margin:0;line-height:1.2}
.follow{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule-strong);display:grid;place-items:center;color:var(--strong)}
.sublinks{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--soft);margin-bottom:28px}
.river .it{display:grid;grid-template-columns:120px minmax(0,1fr) 240px;gap:var(--gut);padding-block:20px;border-top:1px solid var(--rule)}
.river .dt{font-size:13px;color:var(--muted)}
.river img{width:100%;aspect-ratio:3/2;object-fit:cover}

/* article */
.subnav{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 24px;padding-block:12px;border-bottom:1px solid var(--rule);font-size:15px;color:var(--soft)}
.subnav b{color:var(--strong)}.subnav button:hover{color:var(--strong)}
.art{max-width:640px;margin:0 auto;padding-block:40px 20px}
.art h2{font-family:var(--serif);font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.28;color:var(--strong);margin:0 0 14px;text-wrap:balance}
.art .dek{font-size:20px;line-height:1.5;color:var(--strong);margin-bottom:14px}
.art .times{font-size:14px;color:var(--muted);line-height:1.6}
.tools{display:flex;gap:6px;align-items:center;margin:14px 0 30px;position:relative;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--strong);padding:7px 10px;border-radius:999px}
.tool:hover{background:var(--chip)}.tool.on{color:var(--live)}
.share{position:absolute;top:44px;left:0;width:240px;padding:8px;z-index:5}
.share a,.share button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;font-size:14px;color:var(--strong);border-radius:6px}
.share a:hover,.share button:hover{background:var(--chip)}
.art .byline{font-size:16px;color:var(--ink);margin:22px 0}.art .byline b{color:var(--strong)}
.art .body p{font-family:var(--serif);font-size:19px;line-height:1.85;color:var(--strong);margin:0 0 24px}
.srcbox{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:16px;font-size:14px;color:var(--soft);line-height:1.6;margin-top:6px}
.srcbox a{color:var(--live)}
.recs{max-width:640px;margin:10px auto 0}
.recs h5{font-weight:700;font-size:16px;color:var(--strong);border-top:1px solid var(--rule-strong);padding-top:14px;margin:30px 0 4px}
.recs a.r{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:16px;padding-block:14px;border-bottom:1px solid var(--rule)}
.recs a.r img{width:110px;aspect-ratio:3/2;object-fit:cover}

<script id="data" type="application/json">[{"id": "p2326794", "k": "કર્નાલના તરાવડીથી દેશવ્યાપી ઝુંબેશની શરૂઆત", "h": "શિવરાજ સિંહ ચૌહાણે રાષ્ટ્રવ્યાપી 'ખેત બચાવો અભિયાન'નો પ્રારંભ કરાવ્યો", "d": "રાસાયણિક ખાતરોનો અવિચારી ઉપયોગ અટકાવવા ૨૨ ઓક્ટોબરથી ૩૦ નવેમ્બર સુધી દેશભરમાં જનજાગરણ ચાલશે", "body": "નવી દિલ્હી ::\nકેન્દ્રીય કૃષિ અને ખેડૂત કલ્યાણ તથા ગ્રામીણ વિકાસ મંત્રી શ્રી શિવરાજ સિંહ ચૌહાણે હરિયાણાના કર્નાલ જિલ્લાના ઐતિહાસિક નગર તરાવડી ખાતેથી રાષ્ટ્રવ્યાપી 'ખેત બચાવો અભિયાન'નો ઔપચારિક પ્રારંભ કરાવ્યો છે. દેશભરના કૃષિ વિજ્ઞાન કેન્દ્રો અને સંસ્થાઓ સાથે વર્ચ્યુઅલી જોડાયેલા લાખો ખેડૂતો અને કૃષિ વૈજ્ઞાનિકોને સંબોધતા તેમણે ચેતવણી આપી હતી કે જો રાસાયણિક ખાતરો અને જંતુનાશકોનો અસંતુલિત ઉપયોગ નહીં અટકે તો ધરતી પાક પેદા કરવાની ના પાડી દેશે અને માનવ શરીર રોગોનું ઘર બની જશે. તેમણે ૨૨ ઓક્ટોબરથી ૩૦ નવેમ્બર દરમિયાન દેશના દરેક ગામમાં વ્યાપક જનજાગરણ અભિયાન ચલાવવાનું આહ્વાન કર્યું હતું.\n\nઆ પ્રસંગે કેન્દ્રીય ગ્રામીણ વિકાસ મંત્રી તરીકે તેમણે હરિયાણાને મોટી ભેટ આપતા પ્રધાનમંત્રી આવાસ યોજના (ગ્રામીણ) હેઠળ ૨૮,૪૨૨ પાકા મકાનોના નિર્માણ માટે ₹૧,૩૪૩.૦૬ કરોડની નાણાકીય મંજૂરીનો પત્ર હરિયાણાના કૃષિ મંત્રી શ્રી શ્યામ સિંહ રાણાને સોંપ્યો હતો.\n\nકેન્દ્રીય મંત્રીએ જણાવ્યું હતું કે આંતરરાષ્ટ્રીય બજારમાં ખાતરના ભાવ વધવા છતાં પ્રધાનમંત્રી શ્રી નરેન્દ્ર મોદીના નેતૃત્વમાં સરકાર ₹દોઢ લાખ કરોડથી વધુની સબસિડી ભોગવી રહી છે, જેથી ખેડૂતોને યુરિયાની થેલી માત્ર ₹૨૬૬ અને ડીએપી ₹૧૩૫૦માં મળે છે. જોકે સસ્તું ખાતર મળવાનો અર્થ એ નથી કે ખેતરોમાં આડેધડ ઉપયોગ કરવો. જમીનમાં જરૂર વગર ખાતર નાખવું એ જમીનમાં ઝેર ભેળવવા સમાન છે. ભારત હવે ગ્રીન એમોનિયાના ઉપયોગ તરફ આગળ વધી રહ્યું છે અને ભવિષ્યમાં ખાતર ઉત્પાદનમાં આત્મનિર્ભર બનશે.\n\nશ્રી ચૌહાણે જમીનના રક્ષણ માટે ત્રણ મહત્વના ઉપાયો રજૂ કર્યા હતા: પ્રથમ, ખેડૂતો સોઇલ હેલ્થ કાર્ડ જોઈને જ જરૂરિયાત મુજબ સંતુલિત ખાતર નાખે. બીજું, પાક ચક્રમાં ફેરફાર કરીને ડાંગર-ઘઉં વચ્ચે ચણા, મસૂર કે તુવેર જેવા કઠોળ વાવે, જે કુદરતી રીતે નાઇટ્રોજન વધારે છે. ત્રીજું, ખેડૂતો ઓછામાં ઓછા અડધા એકરમાં બીજામૃત અને ઘનજીવામૃત બનાવીને પ્રાકૃતિક ખેતી શરૂ કરે. તેમણે પરાળી બાળવા સામે ચેતવણી આપતા કહ્યું કે પરાળી બાળ નો વર્ચ્યુઅલ સંવાદ", "h": "ગ્રામીણ જળ પુરવઠા માટે જેજેએમ ૨.૦ અને ૧૬મા નાણાપંચની ગ્રાન્ટનું સંકલન કરાશે", "d": "૧૬મા નાણાપંચ હેઠળ જળ અને સ્વચ્છતા માટે અંદાજે રૂ. ૧.૭૪ લાખ કરોડ ફાળવાયા હોવાની જાહેરાત", "body": "નવી દિલ્હી :: જળ શક્તિ મંત્રાલયના પેયજળ અને સ્વચ્છતા વિભાગ (ડીડીડબલ્યુએસ) દ્વારા રાજ્યો અને કેન્દ્રશાસિત પ્રદેશો સાથે ચોથી વર્ચ્યુઅલ બેઠકનું આયોજન કરવામાં આવ્યું હતું. આ બેઠક ૧-૨ સપ્ટેમ્બર, ૨૦૨૬ના રોજ યોજાયેલા વિભાગીય જળ શિખર સંમેલન ૨૦૨૬ના અનુવર્તી પરામર્શ શ્રેણીના ભાગરૂપે યોજાઈ હતી. સંમેલનનો મુખ્ય ઉદ્દેશ જળ જીવન મિશન (જેજેએમ) ૨.૦ અને ૧૬મા નાણાપંચ વચ્ચે સંકલન સાધીને જળ સ્ત્રોતોની સ્થિરતા, જળ સુરક્ષા અને ગ્રામ પંચાયતોના નેતૃત્વમાં ટકાઉ ગ્રામીણ પેયજળ સેવા વિતરણની યોજનાને પ્રોત્સાહન આપવાનો હતો.\n\nઆ વર્ચ્યુઅલ સંમેલનમાં વિવિધ રાજ્યોના ગ્રામીણ જળ પુરવઠા વિભાગો, પંચાયતી રાજ વિભાગોના વરિષ્ઠ અધિકારીઓ તેમજ પંચાયતી રાજ મંત્રાલય, ગ્રામીણ વિકાસ મંત્રાલય અને નેશનલ ઇન્ફોર્મેટિક્સ સેન્ટર (એનઆઈસી)ના પ્રતિનિધિઓ જોડાયા હતા. કર્ણાટક, ઓડિશા અને મધ્યપ્રદેશ જેવા રાજ્યોએ સંચાલન અને જાળવણી વ્યવસ્થામાં સુધારો કરવા અને નાણાપંચની ગ્રાન્ટનો લાભ લેવા અંગેના શ્રેષ્ઠ અનુભવો રજૂ કર્યા હતા.\n\nડીડીડબલ્યુએસના સચિવ અશોક કે.કે. મીણાએ જણાવ્યું હતું કે જેજેએમ ૨.૦ સાથે હવે ધ્યાન માત્ર માળખાગત સુવિધાઓના નિર્માણ પૂરતું મર્યાદિત ન રહેતાં કાર્યક્ષમતા, સ્થિરતા અને ગુણવત્તાયુક્ત સેવા વિતરણ પર કેન્દ્રિત થયું છે. તેમણે ૭૩મા બંધારણીય સુધારાનો ઉલ્લેખ કરતાં ગ્રામ પંચાયતોની ભૂમિકાને રેખાંકિત કરી હતી અને જણાવ્યું હતું કે પંચાયતોએ વાર્ષિક સંચાલન અને જાળવણી યોજના તૈયાર કરવામાં નેતૃત્વ લેવું જોઈએ.\n\nએનજેજેએમના ઉપસચિવ કૃતિકા કુલહારીએ માહિતી આપી હતી કે ૧૬મા નાણાપંચ હેઠળ ગ્રામીણ સ્થાનિક સંસ્થાઓ માટે ફાળવાયેલી કુલ રૂ. ૪.૩૫ લાખ કરોડથી વધુની રકમમાંથી આશરે રૂ. ૧.૭૪ લાખ કરોડ જળ વ્યવસ્થાપન અને સ્વચ્છતા માટે ફાળવવામાં આવ્યા છે. પંચાયતી રાજ મંત્રાલયના નિયામક વિપુલ ઉજ્જવલે જરૂરિયાતો, સંસાધનો અને ઉત્તરદાયિત્વના સંકલન પર ભાર મૂક્યો હતો. બેઠકના સમાપનમાં એનજેજેએમના એએસ અને એમડી કમલ કિશોર સોઆને જણાવ્યું હતું કે પૂર્વતૈયારીઓની સમીક્ષા માટે નવેમ્બર ૨૦૨૬માં બે પ્રાદેશિક પરિષદો યોજાશે.", "photo": "/media/2026-10-22/p2326715-0.png", "c cUi8Lr4g1Pn/Un4021H6dPiK6/w5keQXXZ+3W5mSynIVHZSJCM7HHzFdRdSUNezZAP6RuY95rqycjbU/9k=", "sec": "farm"}, {"id": "p2326762", "k": "પ્રદૂષણ સામે કડક કાર્યવાહી", "h": "દિલ્હી-એનસીઆરમાં વાયુ પ્રદૂષણ રોકવા NHAI સજ્જ: ૬૦ સ્પ્રિંકલર અને ૧૪ એન્ટી-સ્મોગ ગન તૈનાત", "d": "રાષ્ટ્રીય ધોરીમાર્ગો પર ૯૦૦થી વધુ શ્રમિકો અને ૨૩ સ્વીપિંગ મશીન કામે લગાડાયા, ૯.૮૦ લાખ વૃક્ષો વાવ્યા", "body": "નવી દિલ્હી :: શિયાળાના આગમન પૂર્વે દિલ્હી-એનસીઆરમાં રાષ્ટ્રીય ધોરીમાર્ગો અને એક્સપ્રેસવે પર વાયુ પ્રદૂષણ નિયંત્રણને સઘન બનાવવા માટે ભારતીય રાષ્ટ્રીય રાજમાર્ગ પ્રાધિકરણ (NHAI) દ્વારા ધૂળ નિયંત્રણના કડક પગલાં હાથ ધરવામાં આવ્યા છે. આ અંતર્ગત આશરે ૬૦ વોટર સ્પ્રિંકલર અને ટેન્કર, ૧૪ એન્ટી-સ્મોગ ગન, ૨૩ મિકેનિકલ રોડ સ્વીપિંગ મશીન, બે ટ્રેક્ટર-માઉન્ટેડ બ્રૂમર અને ૯૦૦થી વધુ શ્રમિકોને તૈનાત કરવામાં આવ્યા છે. આ ઉપરાંત, દિલ્હી-એનસીઆર ક્ષેત્રમાં ૧૫૭ કિલોમીટર લાંબા રાષ્ટ્રીય ધોરીમાર્ગના વિસ્તારો પર ૧૩ મિકેનિકલ રોડ સ્વીપિંગ મશીનો સંચાલિત થઈ રહ્યા છે.\n\nNHAIના ટેકનિકલ સદસ્ય શ્રી આલોક દીપાંકરે પ્રદૂષણ નિયંત્રણ પગલાંઓની સમીક્ષા કરી હતી. તેમણે ફિલ્ડ ટીમોને તમામ સાધનો, શ્રમિકો અને પાણીના છંટકાવની સંપૂર્ણ તૈનાતી, એન્ટી-સ્મોગ ગનના નિયમિત સંચાલન અને દૈનિક મિકેનિકલ સ્વીપિંગ સુનિશ્ચિત કરવા નિર્દેશ આપ્યા હતા. તેમણે વાયુ ગુણવત્તા વ્યવસ્થાપન પંચ દ્વારા નિર્ધારિત ધોરણોના કડક પાલન પર ભાર મૂક્યો હતો, જેમાં બાંધકામ સામગ્રીને ઢાંકવી, ધૂળમુક્ત રસ્તાની સપાટી જાળવવી અને ગ્રેડેડ રિસ્પોન્સ એક્શન પ્લાન અનુસાર કડક પગલાં ભરવાનો સમાવેશ થાય છે. અધિકારીઓને દૈનિક પ્રવૃત્તિઓ પર નજર રાખવા અને જિયો-ટેગવાળા ફોટોગ્રાફ્સ સાથે પ્રગતિ અહેવાલ રજૂ કરવા આદેશ અપાયો છે.\n\nપર્યાવરણીય પહેલના ભાગરૂપે NHAI દ્વારા નાણાકીય વર્ષ ૨૦૨૫-૨૬ દરમિયાન રાષ્ટ્રીય રાજધાની ક્ષેત્રમાં ૯.૫૨ લાખના લક્ષ્યાંક સામે આશરે ૯.૮૦ લાખ છોડ વાવવામાં આવ્યા છે, જેમાં વૃક્ષો બચી જવાનો દર ૯૦ ટકાથી વધુ રહ્યો છે. આ ઉપરાંત દિલ્હીના લેન્ડફિલ સ્થળોમાંથી આશરે ૧૩.૫૮ લાખ ટન અક્રિય કચરાનો ઉપયોગ યુઇઆર-II અને ડીએનડી-સોહના કોરિડોરના તટબંધ નિર્માણમાં કરવામાં આવ્યો છે.\n\nઆ સમીક્ષા બેઠકમાં અર્બન એક્સ્ટેંશન રોડ-II, દ્વારકા એક્સપ્રેસવે, ડીએનડી-સોહના એક્સપ્રેસવે અને દિલ્હી-દેહરાદૂન એક્સપ્રેસવે સહિતના મુખ્ય ટ્રાફિક નિયમન પ્રોજેક્ટ્સની પણ સમીક્ષા કરાઈ હતી. આ પ્રોજેક્ટ્સ વાહનોના ઉત્સર્જન અને ટ્રાફિક જામ ઘટાડવામાં મદદરૂપ બનશે. સાથે જ ગ્રીન દિલ્હી એપ અને સોશિયલ મીડિયા પર મળતી ફરિયાદોના ઝડપી નિકાલ પર પણ ભાર મુકાયો હતો.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326762", "sec": "tech"}, {"id": "p2326691", "k": "ચેન્નઈમાં એસઆરઆઈએચઈઆરનો દીક્ષાંત સમારોહ", "h": "વિશ્વ એઆઈ અને જીન-આધારિત સચોટ ચિકિત્સા યુગમાં, ભારત અગ્રેસર: ડૉ. જિતેન્દ્ર સિંહ", "d": "યુવાનોમાં જીવનશૈલી સંબંધિત બીમારીઓ રોકવી અને અદ્યતન તબીબી તકનીકો અપનાવવી અનિવાર્ય હોવાનું કેન્દ્રીય મંત્રીનું આહ્વાન", "body": "નવી દિલ્હી :: વિશ્વ આર્ટિફિશિયલ ઇન્ટેલિજન્સ (એઆઈ) નિર્દેશિત અને જીન-આધારિત સચોટ ચિકિત્સાના યુગમાં પ્રવેશી રહ્યું છે અને ભારત અદ્યતન આરોગ્ય સંભાળ સમાધાનોના અગ્રણી પ્રદાતાઓમાં ઊભરી રહ્યું છે, તેમ કેન્દ્રીય મંત્રી ડૉ. જિતેન્દ્ર સિંહે જણાવ્યું છે. ચેન્નઈ સ્થિત શ્રી રામચંદ્ર ઉચ્ચ શિક્ષણ અને સંશોધન સંસ્થા (એસઆરઆઈએચઈઆર)ના ૪૨મા દીક્ષાંત સમારોહને મુખ્ય અતિથિ તરીકે સંબોધતા તેમણે આ વાત કહી હતી.\n\nમેડિસિન અને ડાયાબિટીસના પ્રોફેસર રહી ચૂકેલા ડૉ. જિતેન્દ્ર સિંહે જણાવ્યું કે ચિકિત્સાનું ભવિષ્ય તકનીકી પ્રગતિ અને સચોટ નૈદાનિક નિર્ણયના સમન્વય પર તેમજ યુવાનોમાં જીવનશૈલી સંબંધિત રોગો અટકાવવા પર નિર્ભર રહેશે. કુલાધિપતિ વી. આર. વેંકટાચલમ અને પ્રો-ચાન્સલર આર. વી. સિંહ રુતવારની ઉપસ્થિતિમાં તેમણે પદવીધારકો તથા સુવર્ણ ચંદ્રક વિજેતાઓને અભિનંદન પાઠવ્યા હતા અને અસ્વસ્થતાના કારણે ગેરહાજર રહેલાં કુલપતિ ડૉ. ઉમાના ઝડપી સ્વાસ્થ્ય સુધારાની કામના કરી હતી.\n\nચાર દાયકાના તબીબી અનુભવને ટાંકીને મંત્રીએ જણાવ્યું કે અગાઉ ચેપી રોગો પર ધ્યાન અપાતું હતું, પરંતુ હવે મધુપ્રમેહ અને હૃદય રોગ જેવી જીવનશૈલી સંબંધિત બીમારીઓનો બોજ વધ્યો છે. ૩૦ વર્ષની વયે ડાયાબિટીસ થવાથી દાયકાઓ સુધી દુષ્પરિણામો ભોગવવા પડે છે, જેથી યુવાનોમાં આવા રોગોની રોકથામ 'વિકસિત ભારત ૨૦૪૭'ના લક્ષ્ય માટે અત્યંત જરૂરી છે.\n\nતેમણે ઉમેર્યું કે ભારતે કોવિડ-૧૯ સામે સ્વદેશી ડીએનએ રસી, ડેન્ગ્યુ અને મેલેરિયા રસી સંશોધન, હિમોફિલિયા માટે જીન થેરાપી અને ન્યુમોનિયા માટે નેફિથ્રોમાયસિન તેમજ પરમાણુ ચિકિત્સામાં નોંધપાત્ર પ્રગતિ કરી છે. તેમણે જીનોમિક્સ, બાયોમેન્યુફેક્ચરિંગ અને પરમાણુ ચિકિત્સા ક્ષેત્રે રાષ્ટ્રીય સંશોધનો સાથે ભાગીદારી કરવા એસઆરઆઈએચઈઆરને આમંત્રણ આપ્યું હતું.", "photo": "/media/2026-10-22/p2326691-0.jpg", "cap": "ચેન્નઈમાં એસઆરઆઈએચઈઆરના ૪૨મા દીક્ષાંત સમારોહને સંબોધતા કેન્દ્રીય મંત્રી ડૉ. જિતેન્દ્ર સિંહ.", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326691", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAEOAloDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAEDBAUGAgcI/8QAThAAAgEDAwEFBgMFBAcFBQkAAQIDAAQRBRIhMQYTQVFhFCIycYGRB6GxI0JSwdEVM3KCJENTYpLh8BZUk7LxNERjc4MlJjU2ZHSUwuL/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/8QAMxEAAgIBBAEDAgQGAgIDAAAAAAECEQMEEiExQRNRYSJxMpHR4QUjgaHB8BSxM/EkQnL/2gAMAwEAAhEDEQA/ANfd9rNSu5XSzUW8IJAO3LY88nxpLPtPqtscysLiMdQ45P1Fa6TR7S4ix3aqT4gVHfs5bCIiNQW8M9K2U41TRThG+x/RtZtdYhLQEq6/HG3Uf1Fd3WiafdEs1uEf+KL3T+VZC40bUdDvlv7Ed4V6gdCPEGttpt7HqNnHcxfC45Hip8QaiSS5RFNdlDP2bvISW06+b/DISD9xVdcXXaDTv7/vgo/e+JfvW6xRUUhqzADtdqCL1iY9Blapri7luJWkmfc7HJJ869FvdC0y9O6e1QP/ABJ7p/KqK87FA5NldkeSzDP5ik0NOjJd4fOlE7Cpt92d1WzyWtWkX+KH3h/WqlsqxDAqw8CMGpcWWpE1bwjqadF9uO1Tg+J8qqi5Jwp58/KlBC9KmitxoLe/MYARuBU6LVTxvANZMSY6E06lww6MaQ6izbQanC3jt+RxU1L5Nue+IHqc1ghelRkkU/DeFiGY4A6DPSqUmQ8SfRvknMoBLDb4AjrUlZW8gfkaxMOpyL0Ymp8GtEfFVKZm8TRqhL5q360olXzx8+KpINYjbq1WtnK1ym9eE8/P5VSlZDi0SDIB0IOfWs9rUOq6nmCIdxaZ5AbDSeh8h/16VpgoAwBRsXyFDsaRg27NXLY/bRr58HFTLLQNSXldVEePCIt+la4xKfCmniVDlfi8B51KvyU+uCDZ2N9bsWm1aWaPHCtEvH161Yks/wAJ2jzpoK5OZBux0APAp0PzyGA+VWQdAMowNuKXJ8V+xpA6/wAQpcjGcigdhuHjkfSlDA9CKTJbpwKUADwpDs6opKKBi0Vzk+HNGT5fY0ABBPQ4pAGHkaXePEEfSjep8RQAZPiv2NJvHjkfMUpbwHJowT1+1ABuB4HJoxnrS7QfAUmweGR9aAOqSuTkfvflS+9jwoAU4FJ7x9KAcfumjevicfOgA5HgD9aN3mCPpS5GM5pMk9BikAbh5ikyT0H1NLtHU8n1pCg+XyoGG3z5paQgj9771yGY9AD60ALsHlj5Vzz+6SaX/Fn+VdAg9CKVDGyH9MehoBC/ukfSnKXFFBZwGU9CKCQOPHypzaPKjFOhWMkMfSudg8eT61IIFNMf4QTRQ0xvYPDI+Rrk5Xq4+RFdcn4iV+Q/nSqqj4c 8itplqsq7gLru/pk1Lt4hFd2iDrHIyZ9A/H61nKVWjSMb5KNpQdeD+BnUfTmrAQyy6TqBxzAq7fkrkfzqo1VPZtakUHhJ8jFX9pKyXtzb9UlhZj8/dNXk4SaIhy2vk7uMXWlpMvxDB+eaxsQIhkRjyGxWv0xN1lJbk8ANtPljkVWyJJOWH7PAORlarTy2to0yYvUpkrsZpci2EvtY7tXYNH7w5GPLwqDeTCLVDn4SKkIlwwwZgP8ADxVdrSFJy2emB9KpvdPnyaZIbMUYrwT/AHg8Y5JCkqPAk4A/nVvpkXcxlweEUsPU/CPzqBpKGXT4GkILLuwfQZAq0b/R7KJOplCkn6k1yZHztCC4sqrK3eftA5VclVEh+4xVFezmK8njAICSMuPkan3V+9vfXzRjmSMQ9enI5/Ks3JdzNIzFzkknrW0YbuTCc1F0f//Z", "sec": "tech"}, {"id": "p2326734", "k": "દરિયાઈ ભાગીદારી", "h": "ભારતીય નૌસેનાનું પ્રથમ પ્રશિક્ષણ સ્ક્વોડ્રન માલદીવ પહોંચ્યું", "d": "આઈએનએસ તીર, સુજાતા અને સારથી જહાજોનું માલે ખાતે માલદીવ રક્ષા દળ દ્વારા ઉષ્માભર્યું સ્વાગત", "body": "નવી દિલ્હી ::\nભારતીય નૌસેનાના પ્રથમ પ્રશિક્ષણ સ્ક્વોડ્રન (1TS)ના જહાજો આઈએનએસ તીર, આઈએનએસ સુજાતા અને ભારતીય તટરક્ષક દળનું જહાજ સારથી લાંબા અંતરની તાલીમ તહેનાતી અંતર્ગત ૨૧ ઓક્ટોબર ૨૦૨૬ના રોજ માલદીવની રાજધાની માલે પહોંચ્યા છે. માલદીવ રાષ્ટ્રીય રક્ષા દળ (MNDF) દ્વારા સ્ક્વોડ્રનનું ઉષ્માભર્યું સ્વાગત કરવામાં આવ્યું હતું. આ મુલાકાત ભારત અને માલદીવ વચ્ચેની મજબૂત દરિયાઈ ભાગીદારી તથા ગાઢ પ્રાદેશિક સંબંધોને દર્શાવે છે.\n\nબંદર પર રોકાણ દરમિયાન પ્રથમ પ્રશિક્ષણ સ્ક્વોડ્રનના વરિષ્ઠ અધિકારીએ માલદીવના રાષ્ટ્રીય રક્ષા દળના રક્ષા પ્રમુખ અને તટરક્ષક દળના કમાન્ડન્ટ સાથે મુલાકાત કરી હતી. આ દરમિયાન ભારતીય નૌસેના અને માલદીવના રાષ્ટ્રીય રક્ષા દળ વચ્ચે સતત સંપર્ક તેમજ દરિયાઈ ક્ષેત્રમાં વિવિધ પરિમાણો પર સહયોગ વધારવાના મુદ્દાઓ પર ચર્ચા થઈ હતી. આ ઉપરાંત, વરિષ્ઠ અધિકારીએ માલદીવમાં ભારતના ઉચ્ચાયુક્ત શ્રી જી. બાલાસુબ્રમણ્યમ સાથે પણ મુલાકાત કરી હતી. તાલીમ આદાન-પ્રદાન કાર્યક્રમ હેઠળ સ્ક્વોડ્રનના તાલીમાર્થીઓએ ગિરિફુશી પ્રશિક્ષણ કેન્દ્રની મુલાકાત લીધી હતી.\n\nઆ મુલાકાત દરમિયાન બંને દેશોના સૈન્યો વચ્ચે પરસ્પર તાલમેલ અને સમજ વધુ સુદ્રઢ કરવા માટે એકબીજાના જહાજોની મુલાકાત, રમતગમત સ્પર્ધાઓ, સામાજિક મેળાપ અને જનસંપર્ક સાથે જોડાયેલી વિવિધ પ્રવૃત્તિઓનું આયોજન કરવામાં આવશે.\n\nઆ પ્રવાસ ભારતીય નૌસેના અને માલદીવ રાષ્ટ્રીય રક્ષા દળ વચ્ચે બહેતર પરિચાલન તાલમેલ તથા પરસ્પર સમજને પ્રોત્સાહન આપવાની સહિયારી પ્રતિબદ્ધતા દર્શાવે છે. આ સાથે જ તે 'મહ े शशी। उदिते तु सहस्रांशौ न खद्योतो न चन्द्रमाः।।\" સુભાષિતનો અર્થ સમજાવતાં જણાવાયું છે કે ચંદ્ર ઉગે ત્યાં સુધી જ આગિયો ચમકતો દેખાય છે; સૂર્ય ઉગે ત્યારે ન આગિયાનો પ્રકાશ દેખાય છે, ન ચંદ્ર. તેવી જ રીતે, નાની કે મર્યાદિત સિદ્ધિનું મહત્વ ત્યાં સુધી જ હોય છે, જ્યાં સુધી તેનાથી શ્રેષ્ઠ કે મોટું કંઈ સામે ન આવે. તેથી મર્યાદિત સફળતા મળતાં અહંકારી થવાને બદલે વિનમ્ર રહેવું અને સતત શીખતાં રહી પ્રગતિ કરતા રહેવું જોઈએ.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326370", "sec": "india"}, {"id": "p2326374", "k": "", "h": "ભોપાલ કોન્ક્લેવમાં આંતરદેશિય મત્સ્યોદ્યોગના રોકાણ અને નિકાસ પર ભાર", "d": "કોન્ક્લેવમાં ૧,૦૦૦થી વધુ મત્સ્ય પાલકો જોડાશે; મધ્યપ્રદેશની રોકાણ અને નિકાસ માર્ગદર્શિકા જાહેર થશે", "body": "મધ્યપ્રદેશ સરકારના મત્સ્યોદ્યોગ વિભાગ અને ભારત સરકારના મત્સ્યોદ્યોગ, પશુપાલન અને ડેરી મંત્રાલયના મત્સ્યોદ્યોગ વિભાગ દ્વારા ૨૩ ઓક્ટોબર ૨૦૨૬ના રોજ ભોપાલમાં ‘ફિશરીઝ ઇન્વેસ્ટર્સ એન્ડ એક્સપોર્ટર્સ કોન્ક્લેવ ૨૦૨૬’ યોજાશે. કોન્ક્લેવનો હેતુ આંતરદેશિય મત્સ્ય ઉત્પાદનને રોકાણ, પ્રક્રિયા, કોલ્ડ-ચેઈન માળખાકીય સુવિધા, મૂલ્યવર્ધન અને નિકાસ બજારો સાથે જોડવાનો છે. ઉત્પાદન-કેન્દ્રિત અભિગમથી એકીકૃત મૂલ્ય-શૃંખલા મોડલ તરફ વળીને માછીમારો અને મત્સ્ય પાલકો માટે બજાર પહોંચ તથા વળતર સુધારવા પર પણ ધ્યાન અપાશે.\n\nકોન્ક્લેવમાં રોકાણકારો, નિકાસકારો, માછીમારો, મધ્યપ્રદેશના વિવિધ ભાગોમાંથી ૧,૦૦૦થી વધુ મત્સ્ય પાલકો, સહકારી મંડળીઓ, ફિશ ફાર્મર પ્રોડ્યુસર ઓર્ગેનાઈઝેશન્સ (FFPOs), સાહસિકો, સ્ટાર્ટ-અપ્સ, પ્રોસેસર્સ, નાણાકીય સંસ્થાઓ, સંશોધન સંસ્થાઓ અને અન્ય હિતધારકો ભાગ લેશે. આંતરદેશિય રાજ્યોને મત્સ્યોદ્યોગ રોકાણ અને નિકાસ તંત્ર સાથે જોડવા ઉપરાંત, મૂલ્ય-શૃંખલામાં સાહસ વિકાસ, નાણાકીય સહાય, બજાર જોડાણો અને સહયોગની તકો અંગે ચર્ચા થશે.\n\nકોન્ક્લેવમાં ‘મધ્યપ્રદેશ ફિશરીઝ ઇન્વેસ્ટમેન્ટ એન્ડ એક્સપોર્ટ ગાઇડલાઇન્સ, ૨૦૨૬’નું વિમોચન થશે. કેન્દ્રએ મધ્યપ્રદેશને ‘જળાશય મત્સ્યોદ્યોગ ક્લસ્ટર’ તરીકે અધિસૂચિત કર્યું છે. માર્ગદર્શિકાનો હેતુ હેચરી, મત્સ્ય બીજ અને ખોરાક, જળાશય તથા કેજ ફિશરીઝ, જળચર પ્રાણી આરોગ્ય, પ્રક્રિયા, કોલ્ડ-ચેઈન માળખું, લોજિસ્ટિક્સ, મૂલ્યવર્ધન અને બજાર વિકાસ સહિતના ક્ષેત્રોમાં રોકાણ સુગમ કરવાનો છે.\n\nકાર્યક્રમમાં આંતરદેશિય રાજ્યોની નિકાસ ક્ષમતા અંગેની સ્ટાન્ડર્ડ ઓપરેટિંગ પ્રોસિજર્સનું વિમોચન અને ઇન્ટિગ્રેટેડ કેજ કલ્ચર યુનિટ્સનું વર્ચ્યુઅલ ઉદ્ઘાટન પણ થશે. કેન્દ્રીય મત્સ્યોદ્યોગ, પશુપાલન અને ડેરી તથા પંચાયતી રાજ મંત્રી રાજીવ રંજન સિંહ મધ્યપ્રદેશમાં જળાશયો અને અમૃત સરોવરોના સંકલિત વિકાસ માટેની વહીવટી મંજૂરી સુપ્રત કરશે.\n\n૨૦૨૪-૨૫માં ભારતનું મત્સ્ય ઉત્પાદન ૧૯૭.૭૫ લાખ ટન હતું, જેમાં આંતરદેશિય મત્સ્યોદ્યોગનો હિસ્સો ૧૫૧.૬૦ લાખ ટન હતો—દેશના કુલ ઉત્પાદનનો લગભગ પોણો ભાગ. ૨૦૨૫-૨૬માં ભારતની સીફૂડ નિકાસનું મૂલ્ય ₹૭૩,૮૯૦ કરોડ રહ્યું હતું. મધ્યપ્રદેશ પાસે લગભગ ૪.૫૦ લાખ હેક્ટર જળ વિસ્તાર છે. કોન્ક્લેવ રાજ્યના ઉત્પાદન આધારને રોકાણ, પ્રક્રિયા, મૂલ્યવર્ધન અને સ્થાનિક તથા નિકાસ બજારો સાથે જોડવાનો પ્રયાસ કરશે.\n\nકોન્ક્લેવમાં મધ્યપ્રદેશના મુખ્યમંત્રી ડૉ. મોહન યાદવ; કેન્દ્રીય મત્સ્યોદ્યોગ, પશુપાલન અને ડેરી તથા પંચાયતી રાજ મંત્રી રાજીવ રંજન સિંહ ઉર્ફે લલન સિંહ; કેન્દ્રીય રાજ્ય મંત્રી પ્રો. એસ. પી. સિંહ બઘેલ; અને મધ્યપ્રદેશ સરકારના મત્સ્યપાલક કલ્યાણ અને મત્સ્યોદ્યોગ વિકાસ વિભાગના મંત્રી નારાયણ સિંહ પવાર ઉપસ્થિત રહેશે. આયોજકોના જણાવ્યા મુજબ, ચર્ચા અને રોકાણ દ્વારા સ્પર્ધાત્મક, બજાર-કેન્દ્રિત મૂલ્ય-શૃંખલાને પ્રોત્સાહન આપી સાહસો, નિકાસકારો, માછીમારો અને મત્સ્ય પાલકો માટેની તકો મજબૂત કરવાનો પ્રયાસ થશે.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326374", "sec": "farm"}, {"id": "p2326427", "k": "પેન્શનરો માટે સુનાવણી", "h": "ટપાલ વિભાગ પેન્શન ફરિયાદો માટે ૩૦ ઑક્ટોબરે અદાલત યોજશે", "d": "પોસ્ટમાસ્ટર જનરલ ફરિયાદો સાંભળશે; અરજીઓ ૨૬ ઑક્ટોબર સુધીમાં પહોંચાડવાની રહેશે", "body": "ટપાલ વિભાગ દ્વારા પેન્શન સંબંધિત ફરિયાદોના નિરાકરણ માટે ‘પેન્શન અદાલત’નું આયોજન કરવામાં આવી રહ્યું છે. અદાલત ૩૦-૧૦-૨૦૨૬, શુક્રવારે સવારે ૧૧.૦૦ વાગ્યાથી પોસ્ટમાસ્ટર જનરલની કચેરી, હેડ ક્વાર્ટર રીજન, સ્પીડ પોસ્ટ ભવન, શાહીબાગ, અમદાવાદ-૩૮૦૦૦૪ ખાતે યોજાશે.\n\nપોસ્ટમાસ્ટર જનરલ દરેક પેન્શનરને વ્યક્તિગત રીતે સાંભળશે અને ફરિયાદોનું સ્થળ પર જ નિરાકરણ લાવશે. અદાલતનો ઉદ્દેશ પેન્શનરોને વ્યક્તિગત સુનાવણી આપવાનો અને તેમની સમસ્યાઓનો સ્થળ પર ઉકેલ લાવવાનો છે.\n\nટપાલ વિભાગના પેન્શનને લગતી ફરિયાદો ‘વરિષ્ઠ હિસાબ અધિકારી’, પેન્શન વિભાગ, પોસ્ટમાસ્ટર જનરલની કચેરી, હેડ ક્વાર્ટર રીજન, સ્પીડ પોસ્ટ ભવન, શાહીબાગ, અમદાવાદ-૩૮૦૦૦૪ના સરનામે મોકલવાની રહેશે. ફરિયાદો ૨૬-૧૦-૨૦૨૬, સોમવાર સુધીમાં પહોંચી જવી જોઈએ. આ તારીખ પછી મળેલી ફરિયાદો સ્વીકારવામાં આવશે નહીં.\n\nફરિયાદો નક્કર અને સંક્ષિપ્ત હોવી જોઈએ. સામાન્ય સ્વરૂપની અથવા નીતિવિષયક બાબતોને લગતી ફરિયાદો સ્વીકારવામાં નહીં આવે. એક અરજીમાં એકથી વધુ મુદ્દા કે વિષય રજૂ કરી શકાશે નહીં. ફરિયાદ ફરિયાદી પોતે અથવા પેન્શનરના પરિવારનો સભ્ય રજૂ કરી શકે છે.\n\nડાયરેક્ટોરેટના પત્ર ક્રમાંક 44013/2/2010-Coord, તારીખ ૨૫-૦૩-૨૦૧૧ના મુદ્દા ક્રમાંક ૬.૩ મુજબ, ‘સ્ટેન્ડિંગ કમિટી ઓફ વોલન્ટરી એજન્સીઝ’ (SCOVA)ના અધિકૃત પ્રતિનિધિઓ અને માન્ય ટ્રેડ યુનિયનો અથવા પેન્શનર એસોસિએશનોને પણ અદાલતમાં હાજર રહેવા આમંત્રિત કરી શકાય છે. જોકે, તેઓ પેન્શનરોની ફરિયાદો રજૂ કરી શકશે નહીં.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326427", "sec": "india"}, {"id": "p2326498", "k": "કૌશલ્ય તાલીમ અને રોજગાર", "h": "પીએમ-દક્ષમાં અત્યાર સુધી ૩૦૯.૫ કરોડનો ખર્ચ, ૯૬,૧૬૨ને રોજગાર", "d": "૨૦૨૦-૨૧થી ૨૦૨૩-૨૪ દરમિયાન ૧,૮૭,૩૦૫ ઉમેદવારોએ તાલીમ મેળવી; ૯૬,૧૬૨ને રોજગાર મળ્યો", "body": "પ્રધાનમંત્રી દક્ષતા ઔર કુશલતા સંપન્ન હિતગ્રાહી (PM-DAKSH) યોજના વર્ષ ૨૦૨૦-૨૧માં કેન્દ્રીય ક્ષેત્રની યોજના તરીકે શરૂ થઈ હતી. અનુસૂચિત જાતિ (SC), અન્ય પછાત વર્ગ (OBC), આર્થિક રીતે નબળા વર્ગ (EWS), વિમુક્ત અને વિચરતી જાતિઓ (DNTs) તથા કચરો વીણનારાઓ સહિત સફાઈ કર્મચારીઓના સામાજિક-આર્થિક ઉત્થાન માટે સ્વ-રોજગાર અને વેતન-રોજગારને પ્રોત્સાહન આપતી કૌશલ્ય તાલીમ આ યોજના હેઠળ આપવામાં આવે છે.\n\nસામાજિક ન્યાય અને અધિકારીતા વિભાગ (DoSJE)ના ત્રણ નિગમો—નેશનલ શેડ્યૂલ્ડ કાસ્ટ્સ ફાઇનાન્સ એન્ડ ડેવલપમેન્ટ કોર્પોરેશન (NSFDC), નેશનલ બેકવર્ડ ક્લાસીસ ફાઇનાન્સ એન્ડ ડેવલપમેન્ટ કોર્પોરેશન (NBCFDC) અને નેશનલ સફાઈ કર્મચારી ફાઇનાન્સ એન્ડ ડેવલપમેન્ટ કોર્પોરેશન (NSKFDC)—યોજનાનો અમલ કરે છે. DoSJE નિગમોને ભંડોળ આપે છે અને નિગમો કૌશલ્ય વિકાસ અને ઉદ્યોગસાહસિકતા મંત્રાલય (MSDE)ની પ્રધાનમંત્રી કૌશલ વિકાસ યોજના (PMKVY) હેઠળ પેનલબદ્ધ સંસ્થાઓને માર્ગદર્શિકા અને વર્ક ઓર્ડર મુજબ તાલીમ ખર્ચ ચૂકવે છે.\n\nતાલીમ પૂર્ણ થયા પછી સંસ્થાઓએ તાલીમાર્થીઓમાંથી ઓછામાં ઓછા ૭૦%ને વેતન-રોજગાર અને/અથવા સ્વ-રોજગાર આપવો જરૂરી છે. તેમ કરવામાં નિષ્ફળતા બદલ ત્રીજો હપ્તો—તાલીમ ખર્ચના ૩૦% જેટલી રકમ—જપ્ત થાય છે. રોજગારની તકો ઊભી કરવા તાલીમ સંસ્થાઓએ સંબંધિત ઉદ્યોગો સાથે સહયોગ રાખવો પણ ફરજિયાત છે. ત્રણેય નિગમો લક્ષિત જૂથના પાત્ર યુવાનોને પ્રોજેક્ટ સ્થાપવા માર્ગદર્શન, લોન સુવિધા અને સહાય આપે છે.\n\nવર્ષ ૨૦૨૦-૨૧થી ૨૦૨૩-૨૦૨૪ દરમિયાન PM-DAKSH માટે કુલ રૂ. ૨૭૬.૪૭ કરોડ ફાળવાયા હતા, જ્યારે અત્યાર સુધીમાં રૂ. ૩૦૯.૫ કરોડનો વાસ્તવિક ખર્ચ થયો છે. વર્ષ ૨૦૨૦-૨૧થી ૨૦૨૩-૨૪ દરમિયાન યોજનામાં ૧,૮૭,૩૦૫ ઉમેદવારોએ તાલીમ મેળવી અને ૯૬,૧૬૨ ઉમેદવારોને રોજગાર મળ્યો.\n\nયોજનાના મૂલ્યાંકન અભ્યાસમાં તેની પ્રાસંગિકતા અને શીખવાની અસરકારકતા મજબૂત હોવાનું જણાયું. ૯૦%થી વધુ લાભાર્થીઓએ તાલીમને કારકિર્દીના લક્ષ્યો, સ્થાનિક શ્રમબજારની જરૂરિયાતો અને ઇચ્છિત તાલીમ પરિણામો સાથે યોગ્ય રીતે જોડાયેલી ગણાવી. ખાસ કરીને મહિલાઓ અને સીમાંત જૂથોમાં આત્મવિશ્વાસ, આત્મસન્માન અને સામાજિક માન્યતામાં સુધારા જેવા બિન-ભૌતિક લાભો નોંધાયા. મોટાભાગના લાભાર્થીઓ કૌશલ્યોનો ઉપયોગ ચાલુ રાખે છે, લાંબા ગાળાની આવક વૃદ્ધિની અપેક્ષા રાખે છે અને સુધારાઓ સ્વતંત્ર રીતે જાળવી શકતા હોવાનું માને છે.\n\nવર્ષ ૨૦૨૪-૨૫થી PM-DAKSHને MSDEની PMKVY યોજના સાથે ભેળવવાનો નિર્ણય લેવાયો. PM-DAKSH પૂરક યોજના હતી અને તેમાં કૌશલ્ય તાલીમ માટેના તમામ જોબ રોલ્સ PMKVY હેઠળ પણ આવરી લેવાતા હતા તથા સ્કિલ ઇન્ડિયા ડિજિટલ હબ (SIDH) પોર્ટલ પરથી લેવામાં આવતા હતા. પુનરાવર્તન ટાળવા PM-DAKSHને PMKVY હેઠળ સમાવાઈ છે.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326498", "sec": "economy"}, {"id": "p2326534", "k": "", "h": "ઉપરાષ્ટ્રપતિએ જૂના કાયદા રદ કરી કાયદાકીય સુધારાનું આહ્વાન કર્યું", "d": "નવી દિલ્હીની પરિષદમાં કેન્દ્ર-રાજ્ય સહકાર અને અપ્રસ્તુત કાયદાઓની સમીક્ષા પર ભાર મૂક્યો", "body": "ભારતના ઉપરાષ્ટ્રપતિ શ્રી સી. પી. રાધાકૃષ્ણને વિજ્ઞાન ભવન, નવી દિલ્હી ખાતે ભારતના વિધિ પંચ દ્વારા આયોજિત ‘સહકારી સંઘવાદ અને કાયદાકીય સુધારા: રાષ્ટ્રીય અને રાજ્ય પરિપ્રેક્ષ્ય’ પરિષદનું ઉદ્ઘાટન કર્યું હતું.\n\nસભાને સંબોધતાં તેમણે ‘ટીમ ઈન્ડિયા’ની ભાવના પર ભાર મૂકતાં કેન્દ્ર અને રાજ્યો વચ્ચે વધુ પરામર્શ, સંકલન અને સહિયારી જવાબદારીનું આહ્વાન કર્યું હતું. વ્યાપક જાહેર હિત માટે સાથે મળીને કામ કરવામાં રાજકીય મતભેદો આડે આવવા જોઈએ નહીં, એમ તેમણે જણાવ્યું હતું.\n\nઉપરાષ્ટ્રપતિએ કહ્યું હતું કે ભારતની તાકાત વિવિધતામાં એકતામાં છે. બંધારણ સંઘની તાકાતને રાજ્યોની જવાબદારીઓ અને વાજબી સ્વાયત્તતા સાથે સંતુલિત કરવાનું માળખું પૂરું પાડે છે. ભારતીય સંઘવાદની સાચી તાકાત વિવિધતાનો આદર કરીને સમાન રાષ્ટ્રીય ઉદ્દેશ્યો તરફ કામ કરવામાં છે.\n\nવિકસિત ભારત @૨૦૪૭ માટે મજબૂત કાયદાઓ, પારદર્શક સંસ્થાઓ, કાર્યક્ષમ વહીવટ અને સૌ માટે ન્યાય જરૂરી હોવાનું તેમણે જણાવ્યું હતું. તેમણે છેલ્લા ૧૨ વર્ષમાં ગુલામીના યુગના ૩ ગુનાહિત કાયદાઓ બદલવા અને ૧,૭૦૦થી વધુ જૂના અપ્રસ્તુત કાયદાઓ રદ કરવાને કાયદાકીય માળખાના આધુનિકીકરણ તરફનું મોટું પગલું ગણાવ્યું હતું. જીવનની સરળતા અને કાર્યક્ષમ સુશાસન માટે જૂના કાયદાઓ ઓળખી તેમાં સુધારા કરવા અથવા તેમને રદ કરવાની ભલામણ કરવા તેમણે રાજ્યના વિધિ પંચોને આગ્રહ કર્યો હતો.\n\nકાયદાકીય સુધારામાં સહકારી સંઘવાદનો અર્થ દરેક બાબતમાં એકરૂપતા નથી, એમ જણાવી તેમણે કહ્યું હતું કે બંધારણીય જવાબદારીઓ જ્યાં એકરૂપ થાય ત્યાં કેન્દ્ર અને રાજ્યોએ સાથે કામ કરવું જોઈએ અને રાજ્યોની વિશિષ્ટ જરૂરિયાતો માટે યોગ્ય જગ્યા જાળવવી જોઈએ. ભારતના વિધિ પંચ, રાજ્ય વિધિ પંચો અને રાજ્યના કાયદા વિભાગો વચ્ચે આંતર-રાજ્ય પરામર્શ, ઉત્કૃષ્ટ પદ્ધતિઓના આદાનપ્રદાન અને જૂના કાયદાઓની પદ્ધતિસરની સમીક્ષા દ્વારા મજબૂત સંકલનનું તેમણે આહ્વાન કર્યું હતું.\n\nસંસદમાં સ્થાપિત સેંગોલનો ઉલ્લેખ કરતાં ઉપરાષ્ટ્રપતિએ સુશાસન અને કાયદાના શાસન અંગે તમિલ સંત-કવિ તિરુવલ્લુવરના જ્ઞાનને યાદ કર્યું હતું. સત્તાના ઉપયોગ કરતાં સુશાસન કાયમી સફળતા અને સમૃદ્ધિનો પાયો છે, એમ તેમણે ભારપૂર્વક જણાવ્યું હતું. પરિષદ સુસંગત, પ્રતિભાવશીલ અને નાગરિક-કેન્દ્રી કાયદાકીય માળખા માટે નક્કર અને અમલયોગ્ય ભલામણો રજૂ કરશે તેવી આશા પણ તેમણે વ્યક્ત કરી હતી.\n\nઆ પ્રસંગે કેન્દ્રીય કાયદા અને ન્યાય રાજ્ય મંત્રી (સ્વતંત્ર પ્રભારી) શ્રી અર્જુન રામ મેઘવાલ, ભારતના વિધિ પંચના અધ્યક્ષ જસ્ટિસ દિનેશ માહેશ્વરી, સભ્ય સચિવ ડૉ. અંજુ રાઠી રાણા અને સભ્ય પ્રો. ડી. પી. વર્મા સહિતના મહાનુભાવો ઉપસ્થિત રહ્યા હતા.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326534", "sec": "india"}, {"id": "p2326572", "k": "", "h": "કાશી તમિલ સંગમમ 5.0 માટે પ્રહલાદ જોશીએ નોંધણી પોર્ટલ લોન્ચ કર્યું", "d": "કાર્યક્રમ ૨૮ નવેમ્બરથી ૧૨ ડિસેમ્બર, ૨૦૨૬ દરમિયાન તિરુક્કુરલની થીમ સાથે યોજાશે", "body": "કેન્દ્રીય શિક્ષણ મંત્રી પ્રહલાદ જોશીએ ૨૮ નવેમ્બરથી ૧૨ ડિસેમ્બર, ૨૦૨૬ દરમિયાન યોજાનારા કાશી તમિલ સંગમમની પાંચમી આવૃત્તિ, KTS 5.0, માટે નોંધણી પોર્ટલ લોન્ચ કર્યું છે. ‘એક ભારત શ્રેષ્ઠ ભારત’ની ભાવનાને મજબૂત કરવા સાથે આ કાર્યક્રમ તમિલનાડુ અને કાશી વચ્ચેના પ્રાચીન નાગરિકતા સંબંધોની ઉજવણી અને પુનઃપુષ્ટિ કરશે.\n\nલોન્ચ પ્રસંગે જોશીએ કહ્યું કે પ્રાચીન સમયથી દેશમાં મજબૂત સાંસ્કૃતિક એકતા રહી છે. ધાર્મિક પરંપરાના ભાગરૂપે ઘણા લોકો કાશી અને રામેશ્વરમની મુલાકાત લેતા, જે ઉત્તર અને દક્ષિણ ભારત વચ્ચેના ઊંડા સાંસ્કૃતિક સંબંધો દર્શાવે છે. કાર્યક્રમ વિદ્યાર્થીઓ, શિક્ષકો, લેખકો, વ્યાવસાયિકો, કૃષિકારો, કલાકારો, મહિલાઓ અને આધ્યાત્મિક વિદ્વાનોને એક મંચ પર લાવશે. ઉચ્ચ શિક્ષણ સંસ્થાઓમાં શૈક્ષણિક આઉટરીચ દ્વારા વિદ્યાર્થીઓને સંગમમના ઉદ્દેશ્યોથી પરિચિત કરાશે.\n\nKTS 5.0ની થીમ ‘તિરુક્કુરલ પયિલવોમ – તિરુક્કુરલ અભ્યાસ કરેં’ છે. આ આવૃત્તિ શાસ્ત્રીય તમિલ ગ્રંથ ‘તિરુક્કુરલ’ના નૈતિક અને સદાચારી જ્ઞાનને યુવાનો અને દેશભરના શીખનારાઓ સુધી પહોંચાડવાનો પ્રયાસ કરશે. શૈક્ષણિક જોડાણ, બહુભાષી સંસાધનો અને જાહેર આઉટરીચ દ્વારા ગ્રંથના સાર્વત્રિક મૂલ્યોને વાંચવા, સમજવા અને જીવનમાં ઉતારવા પ્રોત્સાહિત કરાશે.\n\nતમિલનાડુના આશરે ૧,૪૦૦ સહભાગીઓ સાત જૂથોમાં, પ્રત્યેકમાં ૨૦૦ વ્યક્તિઓ, ભાગ લેશે. તેમની આઠ દિવસની યાત્રામાં ચાર દિવસની મુસાફરી અને ચાર દિવસની મુલાકાતો તથા સંરચિત કાર્યક્રમો રહેશે. કાર્યક્રમમાં વારાણસી, પ્રયાગરાજ અને અયોધ્યાનો સમાવેશ થશે તથા સાંસ્કૃતિક, શૈક્ષણિક, ક્ષેત્ર-વિશિષ્ટ અને આધ્યાત્મિક જોડાણો યોજાશે.\n\nરસ ધરાવતા અરજદારો IIT મદ્રાસ દ્વારા હોસ્ટ કરાયેલા https://kashitamil.iitm.ac.in/ પોર્ટલ પર ૨૨ ઓક્ટોબર, ૨૦૨૬થી ૧૩ નવેમ્બર, ૨૦૨૬ સુધી નોંધણી કરાવી શકશે. અરજીઓ સાત શ્રેણીઓમાં સ્વીકારાશે: વિદ્યાર્થીઓ, શિક્ષકો, લેખકો અને મીડિયા પ્રોફેશનલ્સ, કૃષિ અને સંલગ્ન ક્ષેત્રો, વ્યાવસાયિકો અને કારીગરો, મહિલાઓ તથા આધ્યાત્મિક નેતાઓ.\n\nપ્રથમ કાશી તમિલ સંગમમ ૨૦૨૨માં યોજાયું હતું. ત્યારથી ચાર આવૃત્તિઓએ બંને પ્રદેશો વચ્ચે જ્ઞાન, ભાષા, પરંપરાઓ અને જીવનના અનુભવોના આદાનપ્રદાનને વેગ આપ્યો છે. આ કાર્યક્રમનું આયોજન કેન્દ્રીય શિક્ષણ મંત્રાલયના ઉચ્ચ શિક્ષણ વિભાગ દ્વારા IIT મદ્રાસ, બનારસ હિન્દુ યુનિવર્સિટી, સેન્ટ્રલ ઇન્સ્ટિટ્યૂટ ઓફ ક્લાસિકલ તમિલ, ચેન્નાઈ, ઉત્તર પ્રદેશ સરકાર અને વિવિધ કેન્દ્રીય સરકારી વિભાગો તથા મંત્રાલયોના સહયોગથી થાય છે.", "photo": "/media/2026-10-22/p2326572-0.jpg", "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326572", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAG5AloDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QAShAAAQMCBAMFBAcECAUDBQEAAQACAwQRBRIhMQZBURMUImFxMkKBkQcVIzNSobFyksHRFiQlNENTYvAXRFSC4XOTojVkg4Tx4v/EABoBAAMBAQEBAAAAAAAAAAAAAAABAgMEBQb/xAAtEQACAgEEAQMEAgIDAQEAAAAAAQIRAwQSITETFEFRBSIyYUJScZEjM6E0gf/aAAwDAQACEQMRAD8AwN0aFka80+0CsjCCMBMYSUEdghZIYYQKUEaBjaCXZCyAEIwgQgAgYpC6OyQUAKQSMyUgBV0SJBBQpX3C9M50jpTsqDktTw7MDBlbvZJnDrpViI/EsobUsDTrdPupnSUYc3Q2UPEqGaar7VxvYqzpXkUjmu5Ba9RVHzy5YnDswhcHG5siraTMy4bdPUZbGxznHRPCsgOl1F88FewzDKYqaxbsOSrmsJcZXC1zfVX32csZIAKocTquxeG5dLq4uyZcBMN37gXPNTg0Blxb4KsY7ZwVpAQ6Pe6uT4JRGcxxJdyRHVpCdmY7YHRFYMYblZ2UVctmTjUa6WAUZz3NxCMealOcZKq1z4d2kJUlIXubMNwbqr+RUTXwOqcocPCoGKw9gAIWk25K3o5W9kRfUJtkkM0tn2WadFFfhjmGFznNt6o5ftYCLb7J/F2Mp6e8VhdQqF5khbfkNVS55FfsWGBSuiHZO+SZx6na1+YBWGGQN+8PqqniCsbJPkbyWb5kduhbWRUVNkaLdEUz6IO6F0SMIACAQKAQAaJHZEUABC6HJEgkCF0EECsCCCB1QIIokYSSmAkpN0pFZAmJQRlEUGbAtjwSQAbhY5bLgkAxlY6n8DHP+Jp2kGsbbZSMZt2TfRR2D+uNCexkeBoXkvs8/wDkiJDMxtNlcAipSBIS1COJjqUXOqRAMjlumUlcx15u4qNL7YUg63Ud33iyPdgPN2RH2kpuwSTukMNA+ygg7ZMQKI2rIT/qC6NBrE30XNqd2WoYejguj0hzU7D5L09E+Gjw/qy5ix9JQQXeeMBBBBAHmVBBGAuc+usAF0sMKIGyPtLIJthEEboApeYOam0FJsVdKukXQukXYu6SSiQQMMapSQggLF3SCboIkBYOaUElGgBSCCCBhclZcNSPFbkubKAAFJwmUU9e0nmg5dXHdjZsqxga7bdVdTM2Jtr6HdW1SDUUofFvZY3EGVfbEOY નગર અને કોલ્હાપુરના રાજવી પરિવારોએ હજારો પોલિશ બાળકો અને પરિવારોને ભારતમાં આશરો આપ્યો હતો. પોલેન્ડના લોકો આજે પણ ‘જામ સાહેબ’ને ‘દોબ્રી મહારાજા’ તરીકે યાદ કરે છે. ૨૦૨૨માં યુક્રેનથી ભારતીય વિદ્યાર્થીઓને સુરક્ષિત પરત લાવવામાં પોલેન્ડે મદદ કરી હતી. ‘જામ સાહેબ યુથ એક્સચેન્જ પ્રોગ્રામ’ દ્વારા પોલિશ યુવાનો ભારતની મુલાકાત લઈ રહ્યા છે.\n\nપ્રધાનમંત્રીએ જણાવ્યું કે ગયા વર્ષે પોલેન્ડનું જીડીપી એક ટ્રિલિયન ડોલરના ઐતિહાસિક સ્તરે પહોંચ્યું હતું, જ્યારે ભારતે છેલ્લા ત્રિમાસિક ગાળામાં ૭.૮%નો વિકાસ દર નોંધાવ્યો હતો. ભારત-યુરોપિયન યુનિયન મુક્ત વેપાર કરાર અમલમાં આવ્યા બાદ મશીનરી, રસાયણો, પ્લાસ્ટિક અને એન્જિનિયરિંગ સામાનની ભારતથી પોલેન્ડમાં નિકાસ માટે નવા માર્ગો ખૂલશે. રેલવે અને ગતિશીલતા, અદ્યતન ઉત્પાદન, ખાદ્ય પ્રક્રિયા અને બાયોટેકનોલોજીમાં પોલેન્ડના રોકાણની પણ આશા વ્યક્ત કરાઈ.\n\nપોલેન્ડના પ્રધાનમંત્રી મોટા વ્યાપારી પ્રતિનિધિમંડળ સાથે ભારત આવ્યા છે. બંને દેશોની કંપનીઓ વિશ્વસનીય વૈશ્વિક સપ્લાય ચેઇન વિકસાવવા સહયોગ કરશે અને ૨૦૩૦ સુધીમાં દ્વિપક્ષીય વેપાર બમણો કરવાના સહિયારા લક્ષ્ય તરફ કામ કરશે, એમ જણાવાયું.\n\nબંને દેશો સંરક્ષણ, અવકાશ અને પરમાણુ ઊર્જામાં સહયોગ ગાઢ કરવા સંમત થયા છે. આ વ્યૂહાત્મક ક્ષેત્રોમાં સાથે મળીને વિકાસ અને ઉત્પાદન કરવા પોલિશ કંપનીઓને આમંત્રણ અપાયું છે. મહત્વપૂર્ણ ખનિજો અને કોલસાને ગેસમાં રૂપાંતરિત કરવાના ક્ષેત્રમાં પોલેન્ડની નિપુણતાનો લાભ લઈને નવી ભાગીદારી સ્થાપવાની પણ વાત થઈ.\n\nઆઈટી અને સાયબર સુરક્ષામાં સહયોગ આગળ વધારવા ‘ભારત-પોલેન્ડ સ્ટાર્ટ-અપ બ્રિજ’ સ્થાપવા બંને પક્ષ સંમત થયા છે. બંને દેશોના યુવાનો માટે ટેક્નોલોજી હેકાથોન યોજાશે. એઆઈ, સાયબર સુરક્ષા, ફિનટેક અને અન્ય ઉભરતી ટેક્નોલોજીમાં સહકાર વધારવાની સાથે યુવાનો માટે નવી તકો સર્જવાનો આશય છે.\n\nસંસ્કૃતિ, શિક્ષણ, રમતગમત અને પ્રવાસનમાં સહકાર મજબૂત કરવા પણ નિર્ણય લેવાયો છે. ક્રાકોવ શહેરમાં ભારતીય અભ્યાસ અધ્યક્ષ સ્થાપવામાં આવ્યો છે; પોલેન્ડમાં સંસ્કૃત અભ્યાસ અને ભારતવિદ્યાની સમૃદ્ધ પરંપરા છે.\n\nપ્રાદેશિક અને વૈશ્વિક ઘટનાક્રમોની ચર્ચામાં બંને દેશોએ લોકશાહી મૂલ્યો અને કાયદાના શાસન પ્રત્યેની પ્રતિબદ્ધતા વ્યક્ત કરી. વૈશ્વિક શાસન સંસ્થાઓને વધુ મજબૂત અને અસરકારક બનાવવા સુધારા અનિવાર્ય હોવાનું પ્રધાનમંત્રીએ જણાવ્યું. યુક્રેન હોય કે પશ્ચિમ એશિયા, ભારત શાંતિ માટેના દરેક સાર્થક પ્રયાસને સમર્થન આપતું રહેશે.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326576", "sec": "world"}, {"id": "p2326589", "k": "", "h": "પોલેન્ડના પ્રધાનમંત્રીની ભારત મુલાકાતમાં ચાર પરિણામોની જાહેરાત", "d": "વેપાર, આપત્તિ વ્યવસ્થાપન, સંરક્ષણ અને આતંકવાદ વિરોધી ક્ષેત્રે સહમતિ થઈ", "body": "પોલેન્ડના પ્રધાનમંત્રીની ભારતની સત્તાવાર મુલાકાત દરમિયાન બંને દેશો વચ્ચે ચાર પરિણામોની જાહેરાત કરવામાં આવી છે. તેમાં ૨૦૩૦ સુધીમાં દ્વિપક્ષીય વેપાર બમણો કરવાનો લક્ષ્યાંક નક્કી કરાયો છે.\n\nઆપત્તિ વ્યવસ્થાપન ક્ષેત્રે પોલેન્ડ કોઅલિશન ફોર ડિઝાસ્ટર રિસિલિયન્ટ ઈન્ફ્રાસ્ટ્રક્ચર (CDRI)માં જોડાયું છે. સંરક્ષણ ક્ષેત્રે સંરક્ષણ ઔદ્યોગિક સંવાદ (ડિફેન્સ ઈન્ડસ્ટ્રી ડાયલોગ) સ્થાપવા અને આતંકવાદ વિરોધી મુદ્દાઓ પર સંવાદ કરવા સંમતિ થઈ છે.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326589", "sec": "world"}, {"id": "p2326600", "k": "દ્વિપક્ષીય સંબંધો", "h": "ભારત-પોલેન્ડે ૨૦૩૦ સુધી દ્વિપક્ષીય વેપાર બમણો કરવાનો લક્ષ્યાંક રાખ્યો", "d": "મોદી અને ટસ્કે વ્યૂહાત્મક ભાગીદારીને વેપાર, સંરક્ષણ અને ટેકનોલોજીમાં વિસ્તૃત કરવા સંમતિ દર્શાવી", "body": "ભારતના પ્રધાનમંત્રી શ્રી નરેન્દ્ર મોદીના નિમંત્રણ પર પોલેન્ડ ગણરાજ્યના પ્રધાનમંત્રી ડોનાલ્ડ ટસ્કે ૨૧-૨૩ ઓક્ટોબર ૨૦૨૬ દરમિયાન ભારતની સત્તાવાર મુલાકાત લીધી હતી. તેમની સાથે આશરે ૧૦૦ અગ્રણી CEO અને ઉદ્યોગ પ્રતિનિધિઓનું ઉચ્ચ સ્તરીય પ્રતિનિધિમંડળ આવ્યું હતું. બંને પ્રધાનમંત્રીઓએ દ્વિપક્ષીય, પ્રાદેશિક અને વૈશ્વિક મુદ્દાઓ પર વ્યાપક ચર્ચા કરી હતી.\n\nનેતાઓએ ઓગસ્ટ ૨૦૨૪માં પ્રધાનમંત્રી મોદીની પોલેન્ડની મુલાકાત દરમિયાન સંબંધોને વ્યૂહાત્મક ભાગીદારીનો દરજ્જો આપવાની અને ૨૦૨૪-૨૦૨૮ માટે ભારત-પોલેન્ડ એક્શન પ્લાન અપનાવવાની ઘટના યાદ કરી હતી. તેમણે સપ્ટેમ્બર ૨૦૨૬માં વૉર્સોમાં થયેલી એક્શન પ્લાનની મધ્યસત્ર સમીક્ષાને મંજૂરી આપી હતી. બંનેએ ભાગીદારીને નક્કર, સમયબદ્ધ અને પરસ્પર લાભદાયી પરિણામોમાં ફેરવવાનો સંકલ્પ વ્યક્ત કર્યો હતો.\n\nભારત અને પોલેન્ડે ૨૦૩૦ સુધી દ્વિપક્ષીય વેપાર બમણો કરવાનો લક્ષ્યાંક રાખ્યો છે. ભારતે પોલિશ કંપનીઓને ભારતમાં રોકાણ અને કામગીરી વધારવા આમંત્રણ આપ્યું હતું; ટસ્કે પોલેન્ડને મધ્ય અને પૂર્વ યુરોપ તથા વ્યાપક યુરોપિયન બજારમાં ભારતીય વ્યવસાયો માટે પ્રવેશદ્વાર ગણાવ્યું હતું. બંનેએ કૃષિ સહયોગ વધારવા અને દ્વિપક્ષીય વર્કિંગ ગ્રુપની પ્રવૃત્તિઓ પુનઃશરૂ કરવા સંમતિ આપી હતી. મુલાકાત દરમિયાન યોજાયેલા ભારત-પોલેન્ડ બિઝનેસ ફોરમનું સ્વાગત કરીને ઔદ્યોગિક મશીનરી, સંરક્ષણ, ઈન્ફ્રાસ્ટ્રક્ચર, ફાર્માસ્યુટિકલ્સ, ખાણકામ, નિર્ણાયક ખનિજો, ઊર્જા અને ICT સહિતના ક્ષેત્રોમાં ભાગીદારીને પ્રોત્સાહન આપ્યું હતું.\n\nપ્રધાનમંત્રી મોદીએ USD ૧ ટ્રિલિયન GDPનો આંકડો પાર કરવા બદલ પોલેન્ડને અભિનંદન આપ્યાં હતાં. પોલેન્ડે ભારતના ઝડપી વિકાસ અને આગામી વર્ષોમાં USD ૧૦ ટ્રિલિયનનું અર્થતંત્ર બનવાના તેના માર્ગની પ્રશંસા કરી હતી. નેતાઓએ ભારત-ઈયુ મુક્ત વ્યાપાર સમજૂતી (FTA) પર વહેલા હસ્તાક્ષર, મંજૂરી અને સમયસર અમલીકરણ માટે આહ્વાન કર્યું હતું. તેમના મતે તે વેપાર-રોકાણની તકો વધારશે, મૂલ્ય શ્રંખલાઓને મજબૂત કરશે અને નવા બજારો ખોલશે.\n\nબંને દેશોએ સંરક્ષણ અને સુરક્ષા સહયોગ મજબૂત કરવાની પ્રતિબદ્ધતા વ્યક્ત કરી હતી. સપ્ટેમ્બર ૨૦૨૬માં વૉર્સોમાં યોજાયેલી સંરક્ષણ પરના જોઈન્ટ વર્કિંગ ગ્રુપની ૮મી બેઠકના પરિણામોનું સ્વાગત કરીને નિયમિત આદાનપ્રદાન ચાલુ રાખવા સંમતિ આપી હતી. સંરક્ષણ ઉદ્યોગો વચ્ચે વ્યાપારી રીતે વ્યવહારુ સહયોગની તકો શોધવા અને સંરક્ષણ ઔદ્યોગિક સહયોગ માટે ‘ડિફેન્સ ઈન્ડસ્ટ્રી ડાયલોગ’ વિકસાવવા પ્રોત્સાહન આપ્યું હતું. ભારત-ઈયુ સિક્યોરિટી એન્ડ ડિફેન્સ પાર્ટનરશિપ પર જાન્યુઆરી ૨૦૨૬માં થયેલા હસ્તાક્ષરનું પણ સ્વાગત કર્યું હતું.\n\nઅંતરિક્ષ સહયોગને વ્યૂહાત્મક ભાગીદારીનો મુખ્ય હિસ્સો ગણાવી નેતાઓએ સંસ્થાકીય અને ઉદ્યોગ-સ્તરના જોડાણને પ્રોત્સાહિત કર્યું હતું. સેમિકન્ડક્ટર્સ, AI, ક્વોન્ટમ ટેકનોલોજી અને સ્ટાર્ટઅપ ભાગીદારીમાં સહયોગી સંશોધન વધારવા સંમતિ આપી હતી. બેટરી રિસાયક્લિંગ, દુર્લભ પૃથ્વી ખનિજોના શુદ્ધીકરણ, ભુસ્તરશાસ્ત્ર અને ખાણકામ ક્ષેત્રે સહયોગની તકો પણ ચર્ચાઈ હતી; નિર્ણાયક ખનિજો અંગેનો સમજૂતી કરાર વાટાઘાટો હેઠળ છે.\n\nનેતાઓએ ભારત અને પોલેન્ડ વચ્ચે સીધી વિમાની સેવાઓ વધારવાની તકો શોધવા અને નાગરિક ઉડ્ડયન સત્તામંડળો વચ્ચે સીધી વાટાઘાટોને પ્રોત્સાહિત કર્યું હતું. શિપિંગ, દરિયાઈ સુરક્ષા અને બંદરો વચ્ચેના સહયોગનું મહત્વ સ્વીકાર્યું હતું. ભારત-મિડલ ઈસ્ટ-યુરોપ ઈકોનોમિક કોરિડોર (IMEC) સહિત કનેક્ટિવિટી સુધારવા અને ધ્રુવીય બાબતોમાં વૈજ્ઞાનિક સહયોગ વિકસાવવા સંમતિ વ્યક્ત કરી હતી.\n\nશિક્ષણ અને સંસ્કૃતિના ક્ષેત્રે ક્રાકોવની જગિએલોનિયન યુનિવર્સિટીમાં ભારતીય અધ્યયનની ICCR ચેરનું સ્વાગત કરાયું હતું. બંને દેશોની ઉચ્ચ શિક્ષણ સંસ્થાઓ વચ્ચે સંસ્થાકીય ભાગીદારી, વિદ્યાર્થીઓ અને ફેકલ્ટીના આદાનપ્રદાન તથા સંશોધન વધારવા નેતાઓએ પ્રોત્સાહન આપ્યું હતું. લોકો વચ્ચેના સંબંધોને વ્યૂહાત્મક ભાગીદારીનો મહત્વનો સ્તંભ ગણાવી રમતગમત, યુવા આદાનપ્રદાન અને પ્રવાસન સહિત સાંસ્કૃતિક સહયોગ વધારવા સંમતિ આપી હતી. ભારત અને પોલેન્ડના આર્કાઇવ્ઝના અધિકારીઓ વચ્ચે સહયોગ કરાર પૂર્ણ થયો હતો અને તેના પર ટૂંક સમયમાં હસ્તાક્ષર થવાના છે.\n\nવૉર્સોમાં મહારાજા જામસાહેબ અને કોલ્હાપુર રિયાસતનું સ્મારક બંને દેશોના લોકો વચ્ચેના ઐતિહાસિક સંબંધોનું પ્રતીક હોવાનું બંને પક્ષોએ જણાવ્યું હતું. ઓક્ટોબર ૨૦૨૬માં યોજાયેલી આવૃત્તિ સહિત જામસાહેબ મેમોરિયલ યુથ એક્સચેન્જ પ્રોગ્રામની બે આવૃત્તિઓ યોજાઈ હોવાનું તેમણે નોંધ્યું હતું. ‘ઓપરેશન ગંગા’ હેઠળ યુક્રેનમાં ફસાયેલા ૨,૦૦૦થી વધુ ભારતીય વિદ્યાર્થીઓને પોલિશ સત્તામંડળોએ આપેલી સહાયને પણ યાદ કરી હતી.\n\nવૈશ્વિક મુદ્દાઓ પર બંને પક્ષોએ સંયુક્ત રાષ્ટ્ર સુરક્ષા પરિષદમાં સુધારા અને વિસ્તરણની જરૂરિયાત દર્શાવી હતી. પોલેન્ડે સુધારેલી અને વિસ્તૃત UNSCમાં ભારતની સભ્યપદની સાથે ૨૦૨૮-૨૯ માટે બિન-કાયમી સીટની દાવેદારીને સમર્થન આપ્યું હતું. યુક્રેનમાં ચાલી રહેલા યુદ્ધના માનવતાવાદી પરિણામો અંગે ચિંતા વ્યક્ત કરીને આંતરરાષ્ટ્રીય કાયદા અને સંયુક્ત રાષ્ટ્ર ચાર્ટર અનુસાર વ્યાપક, ન્યાયી અને લાંબા ગાળાની શાંતિની જરૂરિયાતનો પુનરોચ્ચાર કર્યો હતો.\n\nનેતાઓએ તમામ સ્વરૂપોના આતંકવાદ અને હિંસક ઉગ્રવાદની નિંદા કરી હતી. ૨૨ એપ્રિલ ૨૦૨૫ના રોજ જમ્મુ અને કાશ્મીરના પહેલગામમાં થયેલા આતંકવાદી હુમલાની સખત નિંદા કરીને આતંકવાદી સંગઠનો સામે કાર્યવાહી, આતંકવાદના નાણાકીય નેટવર્ક ખોરવવા અને આંતરરાષ્ટ્રીય આતંકવાદ પરના વ્યાપક સંમેલન (CCIT)ને વહેલી તકે અપનાવવા આહ્વાન કર્યું હતું. આતંકવાદ વિરોધી સંવાદ કરવા પણ સંમતિ આપી હતી.\n\nબંને દેશોએ મુક્ત, ખુલ્લા અને શાંતિપૂર્ણ ઈન્ડો-પેસિફિક, ૧૯૮૨ના UNCLOS અને નૌકાપરિવહનની સ્વતંત્રતાના મહત્વને પુનઃપુષ્ટ કર્યું હતું. ભારતે પોલેન્ડને ઈન્ડો-પેસિફિક ઓશન્સ ઈનિશિયેટિવમાં જોડાવા આમંત્રણ આપ્યું હતું. આબોહવા પરિવર્તન સામે વૈશ્વિક કાર્યવાહી, સ્વચ્છ ઊર્જા અને આબોહવા-સાનુકૂળ વિકાસમાં સહયોગ વધારવાની જરૂરિયાત પણ દર્શાવી હતી. ભારતે પોલેન્ડના CDRIમાં જોડાવાના નિર્ણયનું સ્વાગત કર્યું અને તેને ઇન્ટરનેશનલ સોલર અલાયન્સ તથા ગ્લોબલ બાયોફ્યુઅલ્સ અલાયન્સમાં જોડાવા આમંત્રણ આપ્યું હતું.\n\nપ્રધાનમંત્રી ટસ્કે આપેલા આતિથ્ય બદલ આભાર માન્યો હતો. બંને નેતાઓએ વ્યૂહાત્મક ભાગીદારીને વધુ ઊંડી અને વૈવિધ્યસભર બનાવવા તથા એક્શન પ્લાન (૨૦૨૪-૨૦૨૮)નું અસરકારક અમલીકરણ સુનિશ્ચિત કરવાની પ્રતિબદ્ધતા વ્યક્ત કરી હતી. ટસ્કે પ્રધાનમંત્રી મોદીને પોલેન્ડની મુલાકાતે આવવાનું નિમંત્રણ આપ્યું હતું.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326600", "sec": "world"}, {"id": "p2326627", "k": "", "h": "કેન્દ્રે સામાજિક સહાયતા કાર્યક્રમને પાંચ વર્ષ લંબાવી નવું નામ આપ્યું", "d": "દિવ્યાંગ પેન્શન માટે ૪૦ ટકાની પાત્રતા, વયમર્યાદા દૂર અને સહાયના દરમાં વધારો", "body": "પ્રધાનમંત્રીની અધ્યક્ષતામાં કેન્દ્રીય મંત્રીમંડળે ૧૪ ઑક્ટોબર ૨૦૨૬ના રોજ રાષ્ટ્રીય સામાજિક સહાયતા કાર્યક્રમને ૫ વર્ષ ચાલુ રાખવાની મંજૂરી આપી છે. ૨૦૨૬-૨૭થી ૨૦૩૦-૩૧ સુધીના સમયગાળા માટે રૂ. ૫૩,૪૨૮ કરોડની જોગવાઈ સાથે મંજૂરી અપાઈ છે. કાર્યક્રમ હવે પ્રધાનમંત્રી સામાજિક સહાયતા યોજના તરીકે ઓળખાશે.\n\nમંજૂરીમાં કાર્યક્રમ અને તેની ઉપ-યોજનાઓનાં નામ બદલવા, દિવ્યાંગતા પેન્શનમાં સુધારો કરવા તથા અન્ય ઉપ-યોજનાઓ હાલના સ્વરૂપે ચાલુ રાખવાનો સમાવેશ થાય છે. વૃદ્ધાવસ્થા પેન્શન, વિધવા પેન્શન અને કૌટુંબિક લાભ યોજનામાં ફેરફાર નહીં થાય. આ યોજનાઓ હવે અનુક્રમે પ્રધાનમંત્રી વૃદ્ધાવસ્થા પેન્શન યોજના, પ્રધાનમંત્રી વિધવા પેન્શન યોજના અને પ્રધાનમંત્રી પરિવાર લાભ યોજના તરીકે ઓળખાશે. દિવ્યાંગતા પેન્શનનું નામ પ્રધાનમંત્રી દિવ્યાંગજન પેન્શન યોજના કરાયું છે.\n\nદિવ્યાંગતા પેન્શન માટે અગાઉ ૮૦ ટકા કે તેથી વધુ દિવ્યાંગતા અને ઓછામાં ઓછી ૧૮ વર્ષની વય જરૂરી હતી. હવે ૨૦૧૬ના દિવ્યાંગ વ્યક્તિઓના અધિકારો અંગેના અધિનિયમમાં નિર્ધારિત ૪૦ ટકાની બેન્ચમાર્ક દિવ્યાંગતા પાત્રતાનો આધાર બનશે અને લઘુત્તમ વયની શરત દૂર કરાઈ છે; પાત્રતા જન્મથી લાગુ થશે. ૭૯ વર્ષ સુધીના લાભાર્થીઓ માટે કેન્દ્રીય સહાય મહિને રૂ. ૩૦૦થી વધારી રૂ. ૩૭૫ અને ૮૦ વર્ષ તથા તેથી વધુ વયના લાભાર્થીઓ માટે રૂ. ૫૦૦થી વધારી રૂ. ૬૨૫ કરાઈ છે. આ ઉપ-યોજનાના લાભાર્થીઓની સંખ્યા ૮.૩૩ લાખથી વધીને ૨૭.૪૮ લાખ થશે.\n\nદિવ્યાંગતાનું પ્રમાણપત્ર, કુટુંબ ગરીબી રેખા હેઠળ હોવાની શરત અને રાજ્યના સામાજિક કલ્યાણ વિભાગ મારફતે અરજી કરવાની વ્યવસ્થા યથાવત રહેશે. પાત્રતા, લાભાર્થીઓની સંખ્યા અને સહાયના દરો અંગેની સુધારેલી માર્ગદર્શિકા ૩ મહિનાની અંદર બહાર પાડી અમલમાં મૂકવામાં આવશે.\n\nકાર્યક્રમ ૧૫ ઑગસ્ટ ૧૯૯૫ના રોજ શરૂ થયો હતો અને તે ગ્રામીણ તથા શહેરી વિસ્તારોમાં ગરીબી રેખા હેઠળનાં કુટુંબોને આવરી લે છે. તે ૧૦૦ ટકા કેન્દ્રીય સહાય ધરાવતી કેન્દ્ર પુરસ્કૃત યોજના છે. વૃદ્ધો, વિધવાઓ અને દિવ્યાંગ વ્યક્તિઓ માટે માસિક પેન્શન ઉપરાંત કુટુંબના મુખ્ય કમાઉ સભ્યના મૃત્યુ પર એક વખતનો લાભ આપવામાં આવે છે. રાજ્યો અને કેન્દ્રશાસિત પ્રદેશો યોજનાઓનો અમલ કરે છે; લાભાર્થીઓને ઓળખવામાં ગ્રામ પંચાયતો અને નગરપાલિકાઓ પણ ભાગ લે છે તથા ચુકવણી મોટેભાગે ડાયરેક્ટ બેનિફિટ ટ્રાન્સફર (DBT) દ્વારા થાય છે.\n\nઆ કાર્યક્રમ ૨૦૨૫-૨૬માં આશરે ૩.૦૯ કરોડ લાભાર્થીઓને આવરી લેતો હતો. ૧૪ ઑક્ટોબર ૨૦૨૬ની મંજૂરીથી તમામ ૩૬ રાજ્યો અને કેન્દ્રશાસિત પ્રદેશોમાં કવરેજ વધીને ૩.૨૦ કરોડ લાભાર્થીઓ સુધી પહોંચશે.", "photo": "/media/2026-10-22/p2326627-0.jpg", "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326627", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGCAjEDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAEDBAUGAgcI/8QAVxAAAQMDAgIECQkEBQoDBwUBAQIDBAAFEQYSITETFEFRFRYiVGFxk5TRBzJTVVaBkZLSF0JSsyM2daGxJCYzNDVDYnKiwXOCsjdEY3SD8PFFRoSj4cL/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/xAAuEQACAgEEAgIBBAIBBQEAAAAAAQIREgMUIVETMQRB8CJhcaEyscEVM0KBkdH/2gAMAwEAAhEDEQA/ANvo7SunZGkbI/IsFpeddt8da3Fwm1KUotpJJJHEk1ceJ2l/s3Z/cG/00aG/qTp/+zY38tNXdaMlJ4naX+zdn9wb/TR4naX+zdm9wb/TV3S0BR+J2l/s3Z/cG/00eJ2l/s3Z/cG/01d0UBSeJ2l/s3ZvcG/00eJ2l/s3ZvcG/wBNXlFQFINHaX+zVm9wa/TS+Jul/s3ZvcGv01dilqgo/E3S/wBm7N7g1+mjxN0v9m7N7g1+mryioCj8TdL/AGas3uDP6aPE7S/2as3uDP6avKK HjbqX7Q3f3539VHjbqX7Q3f3539VFFQB426l+0N39+d/VR426l+0N39+d/VRRQB426l+0N39+d/VR426l+0N39+d/VRRQB426l+0N39+d/VR426l+0N39+d/VRRQB426l+0N39+d/VR426l+0N39+d/VRRUAeNupftDd/fnf1UeNupftDd/fnf1UUUAeNupftFd/fnf1UeN2pvtFd/fnf1UUUAnjfqf7R3j3539VdeN+pvtHePfnf1UUVCh436m+0d49+d/VR436m+0d49+d/VRRUBz436n+0d49+d/VR436n+0d49+d/VRRQovjfqf7R3j3539VHjfqf7R3j3539VFFQB436n+0d49+d/VR436n+0d49+d/VRRQB436n+0d49+d/VR436n+0d49+d/VRRQCeN+p/tHePfnf1UeN+p/tHePfnf1UUVQdeN+pvtHePfnf1UeN+pvtHePfnf1UUUIc+N+p/tHePfnf1Uvjdqb7RXf3539VFFUCeN2pvtFd/fnf1UvjbqX7RXf3539VFFCB426l+0V39+d/VR426l+0N39+d/VRRVAeNupftDd/fnf1UeNupftDd/fnf1UUVQHjbqX7Q3f3539VJ42ak+0N299c/VRRQgeNmpPtDdvfXP1UeNmpPtDdvfXP1UUUAeNmpPtDdvfXP1UeNmpPtDdvfXP1UUUAnjZqT7Q3b31z9VL416k+0F299c/VRRVAeNepPtBdvfXP1UeNepPtBdvfXP1UUUIL416k+0F299c/VXPjZqT7Q3b31z9VFFQovjZqT7Q3b31z9VHjZqT7Q3b31z9VFFQB42akz/WG7e+ufqpHdU6iWkBd+uqh3Ga4f+9FFSXosP8kR1Xu7L+fdJyvXIWf+9cG63FSsqnyie8vK+NFFeY9yG3Jkpfz5LyvW4TTJed+lX+Y0UVUSYqZD45POfnNOxrncIj6X4k6Uw6n5rjTykqHqINFFVezD9CvXOfLkLkyp0l59XznXXlKUfWSc0C4zgeE2SP8A6qvjRRUl7NQ/xR14UuGc9flZ7+mV8acF6uo5XOb7wv40UVDRWUUUV1POf//Z", "sec": "india"}, {"id": "p2326636", "k": "", "h": "પ્રધાનમંત્રી ૨૩ ઓક્ટોબરે ચિન્મય અમૃત મહોત્સવ વૈશ્વિક સંમેલનનું ઉદ્ઘાટન કરશે", "d": "ત્રણ દિવસના સંમેલનમાં ભારત અને વિદેશના ૯,૦૦૦થી વધુ સહભાગીઓ જોડાશે", "body": "પ્રધાનમંત્રી શ્રી નરેન્દ્ર મોદી ૨૩ ઓક્ટોબર ૨૦૨૬ના રોજ સવારે ૧૧ વાગ્યે ભારત મંડપમ, નવી દિલ્હી ખાતે ચિન્મય અમૃત મહોત્સવ વૈશ્વિક સંમેલનનું ઉદ્ઘાટન કરશે. તેઓ આ પ્રસંગે ઉપસ્થિત જનમેદનીને સંબોધિત પણ કરશે.\n\n૨૩થી ૨૫ ઓક્ટોબર ૨૦૨૬ દરમિયાન યોજાનારા આ ત્રિદિવસીય સંમેલનમાં ભારત અને વિદેશમાંથી ૯,૦૦૦થી વધુ સહભાગીઓ એકત્ર થશે. આ કાર્યક્રમ ચિન્મય મિશનનાં ૭૫ વર્ષ પૂર્ણ થવાની ઉજવણી નિમિત્તે વર્ષભર ચાલેલા ઉત્સવોની પૂર્ણાહુતિ દર્શાવે છે. વેદાંત અને ભગવદ્ ગીતાનું જ્ઞાન સૌ સુધી પહોંચાડવા સ્વામી ચિન્મયાનંદે ૧૯૫૧માં ચિન્મય મિશન નામના વૈશ્વિક આધ્યાત્મિક આંદોલનની સ્થાપના કરી હતી. દાયકાઓ દરમિયાન મિશને આધ્યાત્મિક શિક્ષણ, સાંસ્કૃતિક જાળવણી, યુવા સશક્તિકરણ અને સમુદાય સેવામાં પોતાનું કાર્ય વિસ્તાર્યું છે.\n\nવર્ષભરની ઉજવણીની શરૂઆત ગયા વર્ષે તમિલનાડુના ગંગાઈકોંડા ચોલાપુરમ ખાતે થઈ હતી. ત્યાં પ્રધાનમંત્રીએ ઇલૈયારાજાના સંગીત સાથે ચિન્મય મિશન દ્વારા તૈયાર કરાયેલ ભગવદ્ ગીતાના તમિલ કાવ્યાનુવાદનું વિમોચન કર્યું હતું. આ વર્ષ દરમિયાન અનેક પહેલો અને કાર્યક્રમો યોજાયાં હતાં. તેમાં વિવિધ સ્થળોએ સમૂહ હવન, ત્રિપુરામાં મા સૌંદર્ય ચિન્મયી મંદિરની પ્રાણપ્રતિષ્ઠા અને ‘ચિન્મય ગીતા સમર્પણમ’નો સમાવેશ થાય છે. આ પહેલ હેઠળ વિશ્વભરના ૧ લાખથી વધુ લોકોએ ઓનલાઈન એકસાથે ભગવદ્ ગીતાના ૧૫મા અધ્યાયનો પાઠ કર્યો હતો.\n\nઉજવણીની મુખ્ય પહેલોમાંની એક ‘ગીતા પંચામૃત’ હતી, જે ભગવદ્ ગીતાના પાંચ પસંદગીના શ્લોકો પર કેન્દ્રિત હતી. ગીતાનો સંદેશ સમગ્ર દેશમાં પહોંચાડવા ચિન્મય યુવા કેન્દ્રના ૧૫ યુવા સભ્યોએ ‘ચિન્મય અમૃત યાત્રા’ હાથ ધરી હતી. આ યાત્રા દરમિયાન તેમણે સમગ્ર દેશમાં ૪૦,૦૦૦ કિલોમીટરથી વધુ પ્રવાસ કર્યો હતો.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326636", "sec": "india"}, {"id": "p2326646", "k": "", "h": "સંવિધાન સદનના સેન્ટ્રલ હોલમાં ૨૬-૨૭ ઓક્ટોબરે ૧૨મું BRICS ફોરમ યોજાશે", "d": "જન-કેન્દ્રિત વિકાસ પર ચર્ચા માટે સભ્ય અને ભાગીદાર દેશોના સંસદીય નેતાઓ મળશે", "body": "ભારતીય સંસદ ૨૬ અને ૨૭ ઓક્ટોબર ૨૦૨૬ના રોજ સંવિધાન સદનના સેન્ટ્રલ હોલમાં ૧૨મા BRICS પાર્લામેન્ટરી ફોરમનું આયોજન કરશે. પરિષદનું ઉદ્ઘાટન ૨૬ ઓક્ટોબરે થશે. લોકસભા અધ્યક્ષ ઓમ બિરલાએ સંસદ ભવન ખાતે પત્રકાર પરિષદમાં આ માહિતી આપી હતી.\n\nબિરલાએ જણાવ્યું કે ફોરમ ભારતની સંસદીય કૂટનીતિના ઇતિહાસમાં નવો અધ્યાય અંકિત કરશે. તેમાં BRICSના ૧૧ સભ્ય દેશો અને ૧૦ ભાગીદાર દેશોના સંસદીય પ્રતિનિધિમંડળો, પીઠાસીન અધિકારીઓ, સંસદસભ્યો, કેન્દ્રીય મંત્રીઓ, રાજ્યસભાના ઉપસભાપતિ હરિવંશ, રાજ્ય વિધાનમંડળોના પીઠાસીન અધિકારીઓ અને અન્ય મહાનુભાવો ભાગ લેશે.\n\nપ્રધાનમંત્રી નરેન્દ્ર મોદી કાર્યક્રમમાં ઉપસ્થિત રહેશે અને મુલાકાતે આવેલા પ્રતિનિધિમંડળોના નેતાઓ સાથે સંવાદ કરશે. ફોરમનો મુખ્ય વિષય “જન-કેન્દ્રિત વિકાસ માટે સંસદોને મજબૂત બનાવવી” છે. તેમાં સ્થિતિસ્થાપકતા, નવીનતા, સહયોગ અને ટકાઉપણું સંબંધિત ચાર ઉચ્ચ સ્તરીય સત્રો યોજાશે. ચર્ચામાં સંસ્થાઓને મજબૂત બનાવવી, AI અને ડિજિટલ ટેકનોલોજીમાં માનવ-કેન્દ્રિત નવીનતા, વૈશ્વિક શાસનમાં વધુ પ્રતિનિધિત્વ અને ટકાઉ-સમાવેશી ભવિષ્યમાં સંસદોની ભૂમિકા આવરી લેવાશે.\n\nBRICS સભ્ય અને ભાગીદાર દેશોની આંતરરાષ્ટ્રીય બાબતોની સંસદીય સમિતિઓના અધ્યક્ષોની વિશેષ બેઠકમાં સંસદીય કૂટનીતિ, ક્ષમતા નિર્માણ અને ઉત્કૃષ્ટ પદ્ધતિઓના આદાનપ્રદાન અંગે ચર્ચા થશે. પ્રતિનિધિમંડળો અને સંસદીય મૈત્રી જૂથોના નેતાઓ સાથે દ્વિપક્ષીય અને બહુપક્ષીય વાર્તાલાપ પણ યોજાશે. સંયુક્ત નિવેદનને આખરી ઓપ આપવા પ્રતિનિધિમંડળોના સચિવોની બેઠક ૨૫ ઓક્ટોબર ૨૦૨૬ના રોજ મળશે.\n\nફોરમ દરમિયાન પૂર્ણ સત્રો, સમાંતર બેઠકો, દ્વિપક્ષીય આદાનપ્રદાન અને સાંસ્કૃતિક કાર્યક્રમ યોજાશે. ભારતના ઉપરાષ્ટ્રપતિ વિશિષ્ટ અતિથિઓના સન્માનમાં રાત્રિભોજનનું આયોજન કરશે. પ્રતિનિધિમંડળોના સભ્યો ભારતીય સંસદની મુલાકાત લેશે અને દિલ્હીમાં સાંસ્કૃતિક મુલાકાતો કરશે. પરિષદ ૨૭ ઓક્ટોબરે સંપન્ન થશે.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326646", "sec": "world"}, {"id": "p2326707", "k": "યમુના પુનરુદ્ધાર", "h": "અમિત શાહે યમુના શુદ્ધીકરણના ₹૮,૯૪૧ કરોડના પ્રોજેક્ટ્સ શરૂ કર્યા", "d": "દિલ્હી, હરિયાણા અને ઉત્તર પ્રદેશ સાથે ૨૦૨૯ સુધીમાં યમુના સ્વચ્છ કરવાનો રોડમેપ તૈયાર", "body": "કેન્દ્રીય ગૃહ અને સહકારિતા મંત્રી અમિત શાહે દિલ્હીમાં યમુનાના પુનરુદ્ધાર સાથે સંકળાયેલા ₹૮,૯૪૧ કરોડના પ્રોજેક્ટ્સના લોકાર્પણ અને શિલાન્યાસ સમારોહમાં હાજરી આપી હતી. આ પ્રસંગે દિલ્હીના ઉપરાજ્યપાલ તરનજિત સિંહ સંધૂ અને મુખ્યમંત્રી રેખા ગુપ્તા સહિતના મહાનુભાવો ઉપસ્થિત રહ્યા હતા.\n\nશાહે જણાવ્યું કે પ્રધાનમંત્રી નરેન્દ્ર મોદીએ દિલ્હી સરકાર અને ગૃહ મંત્રાલય સમક્ષ યમુનાને શુદ્ધ કરવાનું વિઝન મૂક્યું હતું. આ યોજના હેઠળ અત્યાર સુધીમાં ૪૦ ટકાથી વધુ સફળતા મળી છે. તેમણે કહ્યું કે કેન્દ્ર તથા દિલ્હી, હરિયાણા અને ઉત્તર પ્રદેશની સરકારોએ ત્રણેય રાજ્યો માટે સમયબદ્ધ રોડમેપ તૈયાર કર્યો છે અને ૨૦૨૯ સુધીમાં યમુનાને સ્વચ્છ કરવાનું લક્ષ્ય રાખ્યું છે. તેમણે મે ૨૦૨૯ પહેલાં યમુનાને શુદ્ધ કરવાનો વિશ્વાસ પણ વ્યક્ત કર્યો.\n\nસમારોહમાં ૧૦ પ્રોજેક્ટ્સનું ઉદ્ઘાટન અને ૩૩ પ્રોજેક્ટ્સનો પ્રારંભ કરાયો હતો. કુલ ₹૮,૯૪૧ કરોડના ખર્ચે શરૂ થયેલી યોજનાઓથી લાખો લીટર પાણી શુદ્ધ થઈને યમુનામાં વહેશે, એમ શાહે જણાવ્યું. હાલના એસટીપીના અપગ્રેડેશન અને નવા એસટીપીની સ્થાપના માટે શિલાન્યાસ થયો છે. વિકેન્દ્રિત એસટીપી પમ્પિંગ સ્ટેશન સ્થાપિત કરાયું છે અને ઘરોને ગટર લાઈનો સાથે જોડવાનું કામ શરૂ થયું છે. સીવર રિહેબિલિટેશન, ટેપિંગ તથા ગટરના કામો પણ આગળ ધપાવાઈ રહ્યાં છે.\n\nશાહે જણાવ્યું કે છેલ્લા ૩૦ વર્ષથી અગાઉની સરકારો દિલ્હીના ગંદા પાણીને યમુનામાં છોડવાની મંજૂરી આપતી હતી અને ડેરીઓમાંથી દરરોજ ૨,૦૦૦ ટન છાણ નદીમાં નાખવામાં આવતું હતું. તેમણે કહ્યું કે દિલ્હી, હરિયાણા અને ઉત્તર પ્રદેશ માટે તૈયાર કરાયેલા સંયુક્ત રોડમેપથી યમુનાને સ્વચ્છ કરવામાં આવશે.\n\nદિલ્હીના કચરા અંગે શાહે કહ્યું કે રેખા ગુપ્તા સરકારે કેન્દ્ર સરકારની મદદથી ૨.૧૭ કરોડ મેટ્રિક ટન કચરો સાફ કર્યો છે અને ૧૦૦ એકર જમીન કચરામુક્ત કરી છે. ઓખલા અને ભલસ્વા ખાતે કચરાના પહાડો ૩૦થી ૪૦ મીટર ઘટ્યા છે, જ્યારે ગાઝીપુર ખાતેનો પહાડ ૧૦થી ૧૫ મીટર નીચે આવ્યો છે. બે વર્ષમાં કચરાના પહાડોની જગ્યાએ બગીચા બનાવાશે, એમ તેમણે જણાવ્યું. દિલ્હીના દરેક ઘરને સીવરેજ જોડાણ આપવા માટે ત્રણ વર્ષનો એક્શન પ્લાન તૈયાર કરાયો હોવાનું પણ તેમણે કહ્યું.", "photo": "/media/2026-10-22/p2326707-0.jpg", "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326707", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAFNAloDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QAVBAAAgEDAgQDBQQFBwkGBAUFAQIDAAQRBSEGEjFBE1FhBxQicYEykaHRFSNCscEkM1JykpPhFhc0Q1NVYvDxJTVEgpSiJlRjc0VkdIOyZYSk0uL/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/8QAMxEAAgICAgICAgAEBQMFAQAAAAECEQMhEjEEQRNRImEUMkJxI1KBodEz4fEFFZGxwfD/2gAMAwEAAhEDEQA/AKTFEBSsbUBWZ1BDc0ZBoCld6A9CSKHQUoijPSgPsJRR9TRjagN6BfQkjejwMUCN6MjagPsA2FADejzgUQo+x/QZAzQxtQIoEbUfQfYBih3oAUO9Hti9B9qAFH2oAZpV+JXsLG9HtQxR0PtCXsICh3oxQNNdh6BihijoqEtAERRgbUZFACk+kxrsICgRS6I0/wCoXoIUVLpJoS7QNhGgBS6SKKuIewsb0D02oyKGKH2mAnFCjxQIortAJIosUrFFilerGEBREUqgelHv+4hJFCjoqPQAAosUdHimAnFDFH1oxUjCIosUdCqALFFSqI9aBBYoYozQoAIik4xSzRUAJoqXSaACoqVRUADFFijFCgAqLFHQoAFJozRUACgaVQoGIoUdFQIGKGKMUKBicUMUqioATihijoqBBYoqVSaBkkjah0FKI6UMbUCAPSjG5oDYUajrQH0ERvQNHg5oEUC9MA6UBR9qA2o ાંસલ કરવામાં કેમિકલ અને પેટ્રોકેમિકલ ક્ષેત્રની અનિવાર્ય ભૂમિકા રહેશે. પ્રધાનમંત્રી નરેન્દ્ર મોદીના સંદેશમાં જણાવાયું કે વ્યવસાય કરવાની સરળતામાં સુધારા અને મુક્ત વેપાર કરારોના વિસ્તરતા નેટવર્કથી રોકાણની નવી તકો તથા આંતરરાષ્ટ્રીય બજારો સુધી પહોંચ મળી રહી છે. પ્રધાનમંત્રીએ આશા વ્યક્ત કરી કે કાર્યક્રમની ચર્ચાઓ એવી ભાગીદારીને પ્રોત્સાહન આપશે, જે ક્ષેત્રના લાંબા ગાળાના વિકાસમાં યોગદાન આપે.\n\nઆરોગ્ય અને પરિવાર કલ્યાણ તથા રસાયણ અને ખાતર રાજ્ય મંત્રી અનુપ્રિયા પટેલે જણાવ્યું કે કેમિકલ અને પેટ્રોકેમિકલ ઉદ્યોગ મૂળભૂત જરૂરિયાતો પૂરી કરવામાં અને જીવનની ગુણવત્તા સુધારવામાં મહત્ત્વનો છે. તેમણે ઉદ્યોગના અગ્રણીઓને સરકારની પ્રોત્સાહક રકમ અને તકોનો લાભ લેવા કહ્યું. ત્રણ નવા સમર્પિત કેમિકલ પાર્ક માટે શરૂ કરાયેલી ‘ભારત ઔદ્યોગિક વિકાસ યોજના’ના અમલમાં રાજ્ય સરકારોની ભૂમિકા મહત્ત્વની હોવાનું પણ તેમણે જણાવ્યું.\n\nમહારાષ્ટ્રના મુખ્યમંત્રી દેવેન્દ્ર ફડણવીસ, મધ્યપ્રદેશના મુખ્યમંત્રી મોહન યાદવ અને ઓડિશાના મુખ્યમંત્રી મોહન ચરણ માઝીએ રાજ્યોમાં રોકાણની તકોનો ઉપયોગ કરવા ઉદ્યોગને આહ્વાન કર્યું. ફડણવીસે કહ્યું કે કેમિકલ ઉદ્યોગ મહારાષ્ટ્રમાં આશરે ત્રણ લાખ લોકોને રોજગારી આપે છે. મહારાષ્ટ્ર ભવિષ્યલક્ષી અને વ્યવસાય કરવાની સરળતા પર આધારિત રોકાણ-મૈત્રીપૂર્ણ નીતિ તૈયાર કરી રહ્યું છે. મધ્યપ્રદેશ અને ઓડિશાના મુખ્યમંત્રીઓએ પણ તેમની રોકાણ નીતિઓ અને માળખાકીય સુવિધાઓનો લાભ લેવા આમંત્રણ આપ્યું.\n\n‘એડવાન્ટેજ ભારત: એન ઇમર્જિંગ ગ્લોબલ કેમિકલ્સ હબ’ થીમ હેઠળ યોજાયેલા કાર્યક્રમમાં જાપાન ભાગીદાર દેશ છે. મહારાષ્ટ્ર, ગુજરાત, ઓડિશા, મધ્યપ્રદેશ, બિહાર, આંધ્રપ્રદેશ અને ઉત્તર પ્રદેશ ભાગીદાર રાજ્યો છે. ૨૦૦થી વધુ ભારતીય અને આંતરરાષ્ટ્રીય પ્રદર્શકો, ૮,૦૦૦થી વધુ બિઝનેસ મુલાકાતીઓ અને ૫૦ અગ્રણી ભારતીય તથા આંતરરાષ્ટ્રીય CEO તેમાં ભાગ લઈ રહ્યા છે. ભારતીય કેમિકલ ઉદ્યોગ ૨૦૩૦ સુધીમાં ૩૦૦ અબજ ડોલર અને ૨૦૪૦ સુધીમાં ૧ ટ્રિલિયન ડોલર સુધી પહોંચવાનો અંદાજ છે. ૧૪મી આવૃત્તિમાં યુવા સંશોધકો, વિદ્યાર્થીઓ અને ઉભરતા સાહસિકો માટે ‘ઇન્ડિયા કેમ યુથ ઇનોવેશન ચેલેન્જ’ પણ શરૂ કરાઈ છે.", "photo": "/media/2026-10-22/p2326728-0.png", "cap": "મુંબઈમાં ‘ઇન્ડિયા કેમ 2026’નું ઉદ્ઘાટન કરતા કેન્દ્રીય મંત્રી જે. પી. નડ્ડા.", "src": "https://www.pib.gov.in/PressRe rxZRf07PYneXCvFlF/Ts9iAkvf9pvE0/2jU9/2m8TT/aNUb3lwrxZRf07PYneXCvFlF/Ts9iAkvf9pvE0/wBo1Pf9pvE0/wBo1RveXCvFlF/Ts9id5cK8WUX9Oz2ICS9/2m8TT/aNT3/abxNP9o1RveXCvFlF/Ts9id5cK8WUX9Oz2ICS9/2m8TT/AGjU9/2m8TT/AGjVG95cK8WUX9Oz2J3lwrxZRf07PYgJL3/abxNP9o1Pf9pvE0/2jVG95cK8WUX9Oz2J3lwrxZRf07PYgJL3/abxNP8AaNT3/abxNP8AaNUb3lwrxZRf07PYneXCvFlF/Ts9iAkvf9pvE0/2jU9/2m8TT/aNUb3lwrxZRf07PYneXCvFlF/Ts9iAkvf9pvE0/wBo1Pf9pvE0/wBo1RveXCvFlF/Ts9id5cK8WUX9Oz2ICS9/2m8TT/aNT3/abxNP9o1RveXCvFlF/Ts9id5cK8WUX9Oz2ICS9/2m8TT/AGjU9/2m8TT/AGjVG95cK8WUX9Oz2J3lwrxZRf07PYgJL3/abxNP9o1Pf9pvE0/2jVG95cK8WUX9Oz2J3lwrxZRf07PYgJL3/abxNP8AaNWqbWbUQdkrEqCmp6OopnMkzTFxBAjANzcXseAuLXIUz3lwrxZRf07PYveloqSjzdyU0MGe2bkow3Nbde3lQHuiIgCIiAIiIAiIgCIiA//Z", "sec": "tech"}, {"id": "p2326743", "k": "એશિયન પેરા ગેમ્સ", "h": "મોદીએ પેરા ગેમ્સના મેડલવિજેતાઓને અભિનંદન પાઠવ્યા", "d": "શીતલ દેવીના બે ગોલ્ડ સહિત ભારતના ખેલાડીઓએ વિવિધ સ્પર્ધાઓમાં મેડલ જીત્યા", "body": "પ્રધાનમંત્રી નરેન્દ્ર મોદીએ એશિયન પેરા ગેમ્સ ૨૦૨૬માં મેડલ જીતવા બદલ સ્વાતિ ચૌધરી, પ્રમોદ ભગત, મનીષા રામદાસ, નિત્યા શ્રી સુમથી સિવાન, કૃષ્ણા નાગર, સુહાસ એલ. યથિરાજ, ભાવિના પટેલ, શુભમ વાધવા, અભિજીત સખુજા, સંજના કુમારી, શીતલ દેવી, તોમન કુમાર અને કપિલ કુમારને અભિનંદન પાઠવ્યાં છે.\n\nસ્વાતિ ચૌધરીએ મહિલાઓની W1 તીરંદાજીમાં પોતાના પ્રથમ જ પ્રયાસમાં સિલ્વર મેડલ જીત્યો. આ કેટેગરીમાં એશિયન પેરા ગેમ્સમાં ભારતનો પ્રથમ મેડલ છે. પુરુષોની ૪૦૦ મીટર ફ્રીસ્ટાઇલ S10 સ્પર્ધામાં પ્રભાવશાળી સમય નોંધાવી કપિલ કુમારે સિલ્વર મેળવ્યો.\n\nપેરા બેડમિન્ટનની મિક્સ્ડ ડબલ્સ SL3-SU5 સ્પર્ધામાં પ્રમોદ ભગત અને મનીષા રામદાસે બ્રોન્ઝ જીત્યો; મિક્સ્ડ ડબલ્સ SH6માં નિત્યા શ્રી સુમથી સિવાન અને કૃષ્ણા નાગરે બ્રોન્ઝ મેળવ્યો. પુરુષોની સિંગલ્સ SL4માં સુહાસ એલ. યથિરાજ અને અભિજીત સખુજાએ બ્રોન્ઝ જીત્યો, જ્યારે મહિલા સિંગલ્સ SL3માં સંજના કુમારીએ બ્રોન્ઝ મેળવ્યો. અભિજીતનો આ પ્રથમ દેખાવ હતો.\n\nપેરા ટેબલ ટેનિસની મિક્સ્ડ ડબલ્સ ક્લાસ XD7 સ્પર્ધામાં ભાવિના પટેલ અને શુભમ વાધવાએ બ્રોન્ઝ મેડલ જીત્યો. ગેમ્સમાં મિક્સ્ડ ડબલ્સમાં ભારતનો આ પ્રથમ મેડલ છે.\n\nશીતલ દેવી અને તોમન કુમારે પેરા કમ્પાઉન્ડ મિક્સ્ડ ટીમ સ્પર્ધામાં ગોલ્ડ જીત્યો. શીતલ દેવીએ મહિલાઓની વ્યક્તિગત પેરા કમ્પાઉન્ડ તીરંદાજીમાં પોતાનો ખિતાબ જાળવી સતત બીજી આવૃત્તિમાં ગોલ્ડ મેળવ્યો. મોદીએ તેમની સિદ્ધિઓની પ્રશંસા કરી અને ખેલાડીઓના પ્રદર્શન, સમર્પણ તથા દ્રઢ સંકલ્પને બિરદાવ્યાં.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326743", "sec": "sport"}, {"id": "p2326749", "k": "", "h": "મોદીએ એશિયન પેરા ગેમ્સના વિજય બદલ સુવર્ણા રાજને અભિનંદન આપ્યાં", "d": "મહિલાઓની ડિસ્કસ થ્રો F54 સ્પર્ધામાં સફળતા બદલ તેમની મહેનત અને દૃઢતાને બિરદાવી", "body": "પ્રધાનમંત્રી નરેન્દ્ર મોદીએ એશિયન પેરા ગેમ્સ ૨૦૨૬માં મહિલાઓની ડિસ્કસ થ્રો F54 સ્પર્ધામાં ભવ્ય વિજય મેળવવા બદલ સુવર્ણા રાજને અભિનંદન પાઠવ્યાં છે.\n\nપ્રધાનમંત્રી કાર્યાલયે X પર શેર કરેલી પોસ્ટમાં મોદીએ જણાવ્યું કે સુવર્ણા રાજની સફળતા તેમની સખત મહેનત, દૃઢતા અને રમતગમતની ઉત્કૃષ્ટતા પ્રત્યેની અચળ પ્રતિબદ્ધતાનું પરિણામ છે. ભારત આ શાનદાર વિજયની ઉજવણી કરે છે, એમ તેમણે ઉમેર્યું હતું. મોદીએ સુવર્ણા રાજને આગામી પ્રયાસો માટે શુભકામનાઓ પણ પાઠવી હતી.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326749", "sec": "sport"}, {"id": "p2326774", "k": "", "h": "નેતન્યાહુએ મોદીને ફોન કર્યો; ભારત-ઈઝરાયેલ ભાગીદારી મજબૂત કરવાનો સંકલ્પ", "d": "બંને નેતાઓએ પશ્ચિમ એશિયામાં શાંતિ-સ્થિરતા પુનઃસ્થાપિત કરવાની તાકીદની જરૂરિયાત પર ભાર મૂક્યો", "body": "પ્રધાનમંત્રી શ્રી નરેન્દ્ર મોદી પર આજે ઈઝરાયેલના પ્રધાનમંત્રી મહામહિમ શ્રી બેન્જામિન નેતન્યાહુનો ટેલિફોન કોલ આવ્યો હતો.\n\nબંને નેતાઓએ ભારત-ઈઝરાયેલ સંબંધોમાં સતત રહેલી ગતિશીલતાનું સ્વાગત કર્યું હતું અને બંને દેશો વચ્ચેની વિશેષ વ્યૂહાત્મક ભાગીદારીને વધુ મજબૂત કરવા માટેની સહિયારી પ્રતિબદ્ધતાનો પુનરોચ્ચાર કર્યો હતો.\n\nનેતાઓએ પશ્ચિમ એશિયાના તાજેતરના વિકાસ અંગે વિચારોનું આદાન-પ્રદાન કર્યું હતું. તેમણે આ વિસ્તારમાં શાંતિ અને સ્થિરતા પુનઃસ્થાપિત કરવાની તાકીદની જરૂરિયાત પર ભાર મૂક્યો હતો.\n\nપ્રધાનમંત્રી મોદીએ આગળ વધવાના માર્ગ તરીકે સંવાદ અને મુત્સદ્દીગીરી માટેના ભારતના આહ્વાનનો પુનરોચ્ચાર કર્યો હતો. બંને નેતાઓ સંપર્કમાં રહેવા માટે સંમત થયા હતા.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326774", "sec": "world"}, {"id": "p2326788", "k": "રાષ્ટ્રીય એકતા દિવસની તૈયારી", "h": "ગોવિંદ મોહને એકતાનગરમાં રાષ્ટ્રીય એકતા દિવસની તૈયારીઓ ચકાસી", "d": "૩૦ અને ૩૧ ઑક્ટોબર, ૨૦૨૬ના કાર્યક્રમનાં સ્થળોની મુલાકાત બાદ અધિકારીઓ સાથે સમીક્ષા બેઠક યોજી", "body": "લોખંડી પુરુષ સરદાર વલ્લભભાઈ પટેલની ૧૫૧મી જન્મજયંતિ નિમિત્તે નર્મદા જિલ્લાના એકતાનગર ખાતે તા. ૩૦ અને ૩૧ ઑક્ટોબર, ૨૦૨૬ના રોજ પ્રધાનમંત્રી શ્રી નરેન્દ્રભાઈ મોદીની ઉપસ્થિતિમાં રાષ્ટ્રીય એકતા દિવસની ઉજવણીનું આયોજન કરવામાં આવ્યું છે. આ રાષ્ટ્રીય કક્ષાના કાર્યક્રમની પૂર્વ તૈયારીઓના ભાગરૂપે કેન્દ્રીય ગૃહ સચિવશ્રી ગોવિંદ મોહને એકતાનગરની મુલાકાત લઈ વિવિધ સ્થળોએ ચાલી રહેલી તૈયારીઓનું નિરીક્ષણ કર્યું હતું. તેમણે સંબંધિત અધિકારીઓ સાથે બેઠક યોજી સમગ્ર આયોજનની વિગતવાર સમીક્ષા પણ કરી હતી.\n\nએકતાનગરના સુરવા હેલિપેડ ખાતે આગમન થતાં ઉચ્ચ અધિકારીઓએ ગોવિંદ મોહનનું સ્વાગત કર્યું હતું. ત્યારબાદ તેમણે ઉજવણી માટે તૈયાર કરવામાં આવી રહેલાં વિવિધ સ્થળોની મુલાકાત લઈ કાર્યક્રમનું આયોજન, માળખાકીય સુવિધાઓ અને અન્ય વ્યવસ્થાઓની સમીક્ષા કરી હતી.\n\nગોવિંદ મોહને સૌપ્રથમ મહાનુભાવોના રોકાણ માટે તૈયાર કરવામાં આવી રહેલા LWE ટેન્ટ્સ/PODS આવાસ સ્થળની મુલાકાત લીધી હતી. ત્યારબાદ તેઓ ટેન્ટ આવાસ સ્થળેથી ટેબ્લો ડોમ પહોંચ્યા હતા, જ્યાં નિર્માણકાર્યોનું નિરીક્ષણ કરી અધિકારીઓ પાસેથી કામગીરીની પ્રગતિ અને આયોજનની વિગતો મેળવી હતી.\n\nતેમણે ટેબ્લો ડોમથી એકતા પથ અને સલામી મંચ સુધીની મુલાકાત લઈ મુખ્ય સમારોહની તૈયારીઓની સમીક્ષા કરી હતી. સ્ટેચ્યુ ઓફ યુનિટી નજીક આવેલા ભારત પર્વ સ્થળે ચાલી રહેલી તૈયારીઓ અને કાર્યક્રમના આયોજન અંગે પણ વિગતો મેળવી હતી. ત્યારબાદ તેમણે પ્રકાશ પર્વની મુલાકાત લીધી હતી.\n\nતા. ૩૦ ઑક્ટોબર, ૨૦૨૬ના રોજ ડેમ વ્યૂ પોઇન્ટ-૧ ખાતે નેશનલ સ્કૂલ ઓફ ડ્રામા (NSD) દ્વારા ‘આનંદમઠ’નું પ્રસ્તુતીકરણ થવાનું છે. આ કાર્યક્રમને ધ્યાનમાં રાખીને ગોવિંદ મોહને ડેમ વ્યૂ પોઇન્ટ-૧ની મુલાકાત લઈ સ્થળ પરની તૈયારીઓનું નિરીક્ષણ કર્યું હતું.\n\nત્યારબાદ એકતાનગરના વીવીઆઈપી સર્કિટ હાઉસ ખાતે તેમણે સંબંધિત ઉચ્ચ અધિકારીઓ સાથે સમીક્ષા બેઠક યોજી હતી. રાષ્ટ્રીય એકતા દિવસની ઉજવણી દરમિયાનના કાર્યક્રમો સુચારુ રીતે સંપન્ન થાય અને તૈયારીઓ સમયમર્યાદામાં પૂર્ણ થાય તે બેઠકનો હેતુ હતો.\n\nબેઠકમાં કાર્યક્રમનાં વિવિધ સ્થળોની તૈયારી, મહાનુભાવો માટેની આવાસ વ્યવસ્થા, નિર્માણકાર્યો, ટેબ્લો ડોમ, સલામી મંચ, ભારત પર્વ તથા સાંસ્કૃતિક કાર્યક્રમોના આયોજન અંગે ચર્ચા થઈ હતી. તમામ સંબંધિત વિભાગો વચ્ચે સંકલન જાળવી કામગીરી સમયસર પૂર્ણ કરવા જરૂરી સૂચનો પણ આપવામાં આવ્યાં હતાં.\n\nબેઠકમાં ડાયરેક્ટર ઓફ આઈ.બી. શ્રી મહેશ દીક્ષિત, ગુજરાત ચીફ સેક્રેટરી શ્રી એમ.કે.દાસ, DG CRPF શ્રી જ્ઞાનેદ્ર પ્રતાપ, નર્મદા નિગમ તથા સ્ટેચ્યુ ઓફ યુનિટીના ચેરમેનશ્રી મુકેશ પુરી, ADG-SPG શ્રી એસ. સુરેશ, DGP ગુજરાત શ્રી જ્ઞાનેદર સિંઘ મલિક, સ્પેશિયલ ડિરેક્ટર IB શ્રી જગ મોહન અને પ્રિન્સિપાલ સેક્રેટરી હોમ શ્રી સંજીવ કુમાર સહિત ઉચ્ચ કક્ષાના અધિકારીઓ ઉપસ્થિત રહ્યાં હતાં.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326788", "sec": "gujarat"}, {"id": "p2326804", "k": "નુઆખાઈ ઉત્સવ", "h": "રાષ્ટ્રપતિ મુર્મુએ રાયપુરમાં નુઆખાઈના કાર્યક્રમોમાં હાજરી આપી", "d": "અન્નના સન્માન, યુવાનોની રાષ્ટ્રસેવા અને મહિલાઓની ભાગીદારીને તેમણે સામૂહિક જવાબદારી ગણાવી", "body": "ભારતનાં રાષ્ટ્રપતિ દ્રૌપદી મુર્મુ આજે (૨૨ ઓક્ટોબર ૨૦૨૬) રાયપુર, છત્તીસગઢ ખાતે નુઆખાઈ ઉત્સવ નિમિત્તે ‘સેવા સન્માન પર્વ’ અને ‘યુવા પ્રબોધન’માં ઉપસ્થિત રહ્યાં હતાં.\n\nસંબોધનમાં તેમણે જણાવ્યું હતું કે નુઆખાઈ મિલન સમારોહ માત્ર સાંસ્કૃતિક ઉજવણી નથી, પરંતુ સમૃદ્ધ પરંપરાઓ, સામાજિક સૌહાર્દ અને એકતા પ્રત્યેની આદરાંજલિ છે. આવા પ્રસંગો મૂળિયાં સાથે પુનઃ જોડાવાની, સાંસ્કૃતિક વિરાસત પર ગર્વ અનુભવવાની અને ભાવિ પેઢીને જીવનમૂલ્યો સોંપવાની તક આપે છે.\n\nરાષ્ટ્રપતિએ નુઆખાઈને કૃષિ પરંપરાઓની ઉજવણી, પ્રકૃતિ પ્રત્યે આભાર અને સમુદાયભાવનાનું પ્રતીક ગણાવ્યું હતું. અન્ન માત્ર ભૂખ સંતોષવાનું સાધન નથી; તે ખેડૂતોની મહેનત, ધરતી માતાની ઉદારતા અને પ્રકૃતિની અમૂલ્ય ભેટોનું પ્રતીક છે, એમ તેમણે કહ્યું હતું. અન્નનું સન્માન કરવું, ખેડૂતોના યોગદાનને સ્વીકારવું અને કુદરતી સંસાધનોનું રક્ષણ કરવું સામૂહિક જવાબદારી છે, એમ તેમણે ભારપૂર્વક જણાવ્યું હતું.\n\nમોટી સંખ્યામાં ઉપસ્થિત યુવાનોને તેમણે નવીનતા લાવવા, કંઈક બહેતર બનાવવાની અને પોતાની આગવી ઓળખ ઊભી કરવાની ઈચ્છા રાખવા જણાવ્યું હતું. યુવાનો પોતાના વ્યક્તિગત પ્રયાસોને સામૂહિક અને રાષ્ટ્રીય લક્ષ્યો સાથે જોડે ત્યારે રાષ્ટ્રની પ્રગતિનો માર્ગ મોકળો થાય છે, એમ તેમણે કહ્યું હતું. તેમણે યુવાનોને મોટાં સ્વપ્નો જોવા, દૃષ્ટિકોણ વ્યાપક બનાવવા, ઉચ્ચ આચરણ જાળવવા અને સમાજ તથા રાષ્ટ્રની સેવાને પ્રયાસોના કેન્દ્રમાં રાખવા પ્રોત્સાહિત કર્યા હતા. જ્ઞાન સાથે નમ્રતા, આકાંક્ષા સાથે નૈતિક મૂલ્યો અને સફળતા સાથે સેવાની ભાવના જોડવાથી વિકસિત ભારતના વિઝનમાં તેમનું યોગદાન મજબૂત થશે, એમ તેમણે જણાવ્યું હતું.\n\nનુઆખાઈ મિલન સમારોહમાં મોટી સંખ્યામાં મહિલાઓની ભાગીદારી જોઈને રાષ્ટ્રપતિએ આનંદ વ્યક્ત કર્યો હતો. વર્ષ ૨૦૪૭ સુધીમાં વિકસિત ભારતનું લક્ષ્ય હાંસલ કરવા મહિલાઓની સમાન ભાગીદારી અત્યંત આવશ્યક છે, એમ જણાવી તેમણે મહિલાઓને રાષ્ટ્ર અને સમાજનાં કાર્યોમાં સક્રિય ભાગ લેવા વિનંતી કરી હતી. પુરુષો, ખાસ કરીને યુવાનો, બહેનો અને પુત્રીઓનાં સ્વપ્નો કોઈ અવરોધ વિના સાકાર કરી શકે એવું વાતાવરણ ઊભું કરે તથા મહિલાઓ પ્રત્યેનો આદર વર્તન અને દૈનિક આચરણમાં દેખાય, એવો અનુરોધ પણ તેમણે કર્યો હતો.\n\nકેન્દ્ર અને રાજ્ય સરકારોના પ્રયાસો તથા પોતાની ઈચ્છાશક્તિના બળે છત્તીસગઢના યુવાનો નક્સલવાદના માર્ગથી દૂર થઈ મુખ્ય પ્રવાહમાં જોડાયા છે, એ નોંધતાં તેમણે આનંદ વ્યક્ત કર્યો હતો. વિકાસનો પ્રકાશ હવે ત્રાસવાદના અંધકારનું સ્થાન લઈ રહ્યો છે. આ પરિવર્તન યુવાનો અને તેમના પરિવારોને કલ્યાણ તરફ દોરી રહ્યું છે તથા રાજ્ય અને દેશના વિકાસને વેગ આપી રહ્યું છે, એમ રાષ્ટ્રપતિએ જણાવ્યું હતું.", "photo": "/media/2026-10-22/p2326804-0.jpg", "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326804", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJYA4QDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAEDBAUGBwII/8QAVRAAAgEDAwIDBAYGBQgHBgUFAQIDAAQRBRIhBjETQVEHImFxFDKBkaGxFSNCUsHRFjNDcpIkU1RiY3OC4SU0ZJOisvAXJkRVdNI1NkWDs8Lxo+KU/8QAGgEAAgMBAQAAAAAAAAAAAAAAAAECAwQFBv/EADsRAAICAQIEAggGAgIBBAMBAAABAhEDEiEEEzFBIlEUMmFxkaHR8AUjUoGxwULhFTNiJFNy8QY0grL/2gAMAwEAAhEDEQA/AMe4owRzWzQ+z7p7cE+jkvnkPM+APnTyPoHpz6GbhdMilCkggTSnscfvVSs8WWvFJGGE80VbxH0N02
