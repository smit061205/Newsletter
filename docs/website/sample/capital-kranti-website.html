રેક રવાના કર્યા હતા. ગયા વર્ષના સમાન સમયગાળાની સરખામણીમાં આ ૭.૧%નો વધારો છે. સપ્ટેમ્બર ૨૦૨૫ની સરખામણીમાં સપ્ટેમ્બર ૨૦૨૬માં પ્રતિદિન કોલસા રેક રવાના કરવાની ગતિમાં ૧૪%નો વધારો થયો હતો.\n\nદેશના કેટલાક ભાગોમાં ઔદ્યોગિક ઉત્પાદનમાં વધારો અને ઓછા વરસાદને કારણે ઊર્જા વપરાશ વધ્યો છે. કોલસા આધારિત વીજ ઉત્પાદનની વધેલી માંગ વચ્ચે કોલસા પરિવહન સતત ગતિએ થઈ રહ્યું છે.\n\nસતત કોલસા નિકાલથી થર્મલ પાવર પ્લાન્ટ્સમાં સ્થિર સ્ટોક જાળવવામાં મદદ મળી છે અને દેશભરમાં વિશ્વસનીય વીજ ઉત્પાદનને ટેકો મળ્યો છે. કોલસાના કાર્યક્ષમ નિકાલ માટે ભારતીય રેલવે કોલસા મંત્રાલય સાથે ગાઢ સમન્વયમાં કામ કરી રહી છે. કોલસાનું પરિવહન અને પુરવઠો જાળવી રાખવા તે ઊર્જા મંત્રાલય સાથે પણ સમન્વય સાધે છે, જેથી થર્મલ પાવર પ્લાન્ટ્સમાં પૂરતો સ્ટોક રહે અને દેશની ઊર્જા જરૂરિયાતો પૂરી થઈ શકે.", "photo": null, "cap": "", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326850", "sec": "economy"}, {"id": "p2326879", "k": "કૃષિ અને સ્વચ્છ ઊર્જા", "h": "રાજ્યો એગ્રીવોલ્ટેઇક્સ માટે નીતિ અને રોકાણને વેગ આપે", "d": "કોન્ફરન્સના બીજા દિવસે રાજ્યની યોજનાઓ, નવી ટેકનોલોજી અને બ્લેન્ડેડ ફાઇનાન્સ પર ચર્ચા થઈ", "body": "એગ્રીવોલ્ટેઇક્સ વર્લ્ડ કોન્ફરન્સ ૨૦૨૬ના બીજા દિવસે રાજ્ય નીતિ નેતૃત્વ, ટેકનોલોજીકલ નવીનતા, ખાનગી ક્ષેત્રની ભાગીદારી અને ક્લાઇમેટ ફાઇનાન્સ અંગે ક્રોસ-સેક્ટરલ જોડાણને વેગ મળ્યો હતો. ઇન્ટરનેશનલ ઇન્સ્ટિટ્યૂટ ફોર સસ્ટેનેબલ ડેવલપમેન્ટ (IISD) અને કાઉન્સિલ ઓન એનર્જી, એન્વાયર્નમેન્ટ એન્ડ વોટર (CEEW) દ્વારા સહ-આયોજિત મંત્રીસ્તરીય સત્રમાં ઓડિશા, મધ્યપ્રદેશ, ઉત્તર પ્રદેશ, રાજસ્થાન અને બિહારના ઊર્જા તથા કૃષિ રાજ્ય મંત્રીઓએ એગ્રીવોલ્ટેઇક અમલીકરણ માટેના રાજ્યસ્તરીય અભિગમો રજૂ કર્યા હતા. રોકાણની તકો, જમીન-ઉપયોગના મોડેલો, ટેરિફ પ્રોત્સાહનો અને સ્થાનિક કૃષિ તથા પાકની સ્થિતિને અનુરૂપ PM-KUSUM યોજનાના અનુકૂલન પર ચર્ચા થઈ હતી.\n\nઉત્તર પ્રદેશના ઊર્જા મંત્રી અરવિંદ કુમાર શર્માએ રાજ્યના કૃષિ આધાર, વિવિધ પાક પદ્ધતિઓ અને વિસ્તરતા સોલર ઇન્ફ્રાસ્ટ્રક્ચરને એગ્રીવોલ્ટેઇક્સ માટેના ફાયદા ગણાવ્યા હતા. ખેતીની સાથે સોલર વીજળી ઉત્પન્ન કરવાથી જમીનનો બહેતર ઉપયોગ અને ખેડૂતોને વધારાની આવક થઈ શકે તેમ તેમણે જણાવ્યું હતું. રૂફટોપ સોલર અને ગ્રીડ ઇન્ફ્રાસ્ટ્રક્ચરની પ્રગતિનો ઉલ્લેખ કરતાં તેમણે કહ્યું કે ગ્રીન એનર્જી કોરિડોર-III રિન્યુએબલ એનર્જી પ્રોજેક્ટ્સ માટે વીજળીના નિકાલને મજબૂત કરશે. રાજ્યમાં કૃષિ જમીન ધરાવતા લોકોમાં નાના અને સીમાંત ખેડૂતોનો હિસ્સો લગભગ ૮૦% હોવાનું જણાવી, તેમણે તેમના માટે અનુકૂળ ધિરાણ અને ટેકનોલોજીની જરૂરિયાત પર ભાર મૂક્યો. રોકાણકારોને ઉત્તર પ્રદેશની તકો અજમાવવા આમંત્રણ આપી તેમણે ગ્રીડ કનેક્ટિવિટી અને વીજળીના નિકાલ માટે રાજ્યના સહયોગની ખાતરી આપી.\n\nઉત્તર પ્રદેશના કૃષિ મંત્રી સૂર્ય પ્રતાપ શાહીએ વીજળીના બિલ માફ કરાયેલા રાજ્યના તમામ ૧૬ લાખ કૃષિ ટ્યુબવેલને સમર્પિત ગ્રીડ ઇન્ફ્રાસ્ટ્રક્ચર મારફતે સોલરાઇઝ કરવાની યોજના જણાવી હતી. તેમણે ખેડૂતોના જમીન માલિકીના હકોનું રક્ષણ, પાકની પસંદગી અને એગ્રીવોલ્ટેઇક પદ્ધતિઓ અંગે સંરચિત તાલીમની જરૂરિયાત દર્શાવી હતી. કૃષિ વિજ્ઞાન કેન્દ્રો, કૃષિ યુનિવર્સિટીઓ અને તકનીકી સંસ્થાઓના ઉપયોગથી ખેડૂતોની ક્ષમતા વધારવા તથા એગ્રીવોલ્ટેઇક્સને કૃષિ વૈવિધ્યીકરણ અને ખેડૂત-સહાયક પહેલો સાથે સાંકળવાનો પ્રસ્તાવ પણ મૂકાયો હતો.\n\nમધ્યપ્રદેશના નવા અને અક્ષય ઊર્જા મંત્રી રાકેશ શુક્લાએ એગ્રીવોલ્ટેઇક્સ, સોલર ડિપ્લોયમેન્ટ અને બેટરી સ્ટોરેજને આગળ ધપાવવાના રાજ્યના પ્રયાસોની માહિતી આપી હતી. ૨૦૨૬ને મધ્યપ્રદેશમાં ‘ખેડૂત કલ્યાણ વર્ષ’ તરીકે મનાવવામાં આવી રહ્યું છે. કેટલાક સ્થળોએ સોલર પેનલ્સની નીચે ખેતી શરૂ થઈ હોવાનું અને બેટરી-સ્ટોરેજ પ્રોજેક્ટ્સ માટે ટેન્ડરિંગ પ્રક્રિયા પૂર્ણ થઈ હોવાનું તેમણે જણાવ્યું હતું. ઓમકારેશ્વર પ્રોજેક્ટ સહિત રાજ્યના અક્ષય ઊર્જા ઇન્ફ્રાસ્ટ્રક્ચરનો પણ તેમણે ઉલ્લેખ કર્યો હતો.\n\nબિહારના ઊર્જા મંત્રી શૈલેષ કુમાર મંડળે ફીડર સેપરેશન અને સોલરાઇઝેશન દ્વારા કૃષિ વીજળી ઇન્ફ્રાસ્ટ્રક્ચર મજબૂત કરવાના પ્રયાસો રજૂ કર્યા હતા. રાજ્યએ આશરે ૨,૭૦૦ કૃષિ ફીડરો પર કામ આગળ ધપાવ્યું છે અને તેમના સોલરાઇઝેશન માટે નાણાકીય સહાય મંજૂર કરી છે. બિહારના કૃષિ મંત્રી વિજય કુમાર સિંહાએ એગ્રીવોલ્ટેઇક્સને ખેડૂતોની આવક વધારવા, પાક વૈવિધ્યીકરણને પ્રોત્સાહન આપવા અને ગ્રામીણ રોજગાર ઊભો કરવાની તક ગણાવી હતી. સંશોધન, ખેડૂતોની જાગૃતિ અને તાલીમ માટે કૃષિ તથા નાણાકીય સંસ્થાઓ અને ઊર્જા સાહસો વચ્ચે સહયોગની જરૂરિયાત તેમણે દર્શાવી હતી.\n\nઓડિશાના નાયબ મુખ્યમંત્રી કનક વર્ધન સિંહ દેવે જણાવ્યું હતું કે રાજ્ય તેની સમર્પિત એગ્રીવોલ્ટેઇક્સ નીતિ ૨૦૨૬ને આખરી ઓપ આપી રહ્યું છે, જેમાં ૨૦૩૦ સુધીમાં ૧ GWનો લક્ષ્યાંક છે. પ્રસ્તાવિત નીતિ મુજબ પ્રોજેક્ટ સ્થળની ઓછામાં ઓછી ૯૦% જમીન ખેતીલાયક રાખવી, ખેડૂતોની સંમતિ અને પાક વીમાનું રક્ષણ કરવું તથા ખેડૂતોને પ્રોજેક્ટની માલિકી રાખવા અથવા ખેતી ચાલુ રાખીને જમીન લીઝ પર આપવાનો વિકલ્પ આપવો જરૂરી રહેશે. GRIDCO મારફતે ૨૫-વર્ષના પાવર પર્ચેસ એગ્રીમેન્ટ્સ (PPA), ગ્રીડ કનેક્ટિવિટી અને રોકાણ પ્રોત્સાહનો આપવાની યોજના પણ તેમણે જણાવી હતી.\n\nનેશનલ સોલર એનર્જી ફેડરેશન ઓફ ઇન્ડિયા (NSEFI)ના ‘એગ્રીવોલ્ટેઇક્સ પિચ-હબ’માં પ્રારંભિક તબક્કાના સંશોધકો અને સ્ટાર્ટ-અપ્સે નિષ્ણાત જ્યુરી સમક્ષ બેંકેબલ, દ્વિ-ઉપયોગી ઉકેલો રજૂ કર્યા હતા. જ્યુરીમાં NISE, NIBE, વેન્ચર કેપિટલિસ્ટ્સ અને ઉદ્યોગના અગ્રણીઓ સામેલ હતા. ફ્રાનહોફર ISE અને સનસીડ APVએ અદ્યતન સોલર ટ્રેકિંગ, ડાયનેમિક પેનલ ટિલ્ટિંગ, સેમી-ટ્રાન્સપરન્ટ ફોટોવોલ્ટેઇક (PV) મોડ્યુલ્સ અને ઉષ્ણકટિબંધીય તથા શુષ્ક પરિસ્થિતિઓ માટેના માઇક્રો-ક્લાઇમેટ સોઇલ સેન્સર્સ પ્રદર્શિત કર્યા હતા.\n\nઇન્ડો-જર્મન ચેમ્બર ઓફ કોમર્સના સંવાદમાં NTPC ગ્રીન એનર્જી, ફર્સ્ટ સોલર અને યુરોપીયન કંપનીઓ સહિતના ડેવલપર્સે સપ્લાય ચેઇનના સ્થાનિકીકરણ, ધોરણો અને બજારની નિશ્ચિતતા અંગે ચર્ચા કરી હતી. એક્ઝિક્યુટિવ રાઉન્ડટેબલમાં વિશ્વ બેંક, KfW, યુરોપિયન ઇન્વેસ્ટમેન્ટ બેંક અને IREDA સહિતની સંસ્થાઓના પ્રતિનિધિઓએ જોખમ ઘટાડવાનાં સાધનો, રાહત દરે ધિરાણ અને મોટા પાયે ખાનગી રોકાણ માટે બ્લેન્ડેડ ફાઇનાન્સ માળખાંની ચર્ચા કરી હતી.\n\nઅભિનેત્રી અને UNDP ઇન્ડિયા યુથ ચેમ્પિયન સંજના સાંઘીએ ફાયરસાઇડ ચેટમાં યુવાનોના નેતૃત્વવાળી સમુદાય વ્યૂહરચનાઓ તથા ખાદ્ય સુરક્ષા, અક્ષય ઊર્જા અને યુવાનોના એકત્રીકરણ વચ્ચેના સંબંધ પર ભાર મૂક્યો હતો. એગ્રીવોલ્ટેઇક્સ યુએન ટકાઉ વિકાસ લક્ષ્યોમાં યોગદાન આપવાની સાથે ગ્રામીણ યુવાનોને સશક્ત કરી આજીવિકા સુરક્ષિત કરી શકે તેમ તેમણે જણાવ્યું હતું. દિવસનો અંત ઇન્ટરેક્ટિવ ડિજિટલ પોસ્ટર ગેલેરીથી થયો, જેમાં કાર્યરત પ્રોજેક્ટ્સ અને વૈશ્વિક કેસ સ્ટડીઝમાંથી મળેલા પાઠ રજૂ કરાયા હતા.", "photo": null, "cap": "કોન્ફરન્સના બીજા દિવસે રાજ્યની એગ્રીવોલ્ટેઇક નીતિઓ, નવી ટેકનોલોજી અને રોકાણ માટેના નાણાકીય માળખાં ચર્ચાયા.", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326879", "sec": "farm"}, {"id": "p2326872", "k": "સામાજિક ન્યાય અને અધિકારિતા મંત્રાલયની પહેલ", "h": "દેશમાં ‘નશા મુક્ત ભારત અભિયાન’ ૩૫ કરોડથી વધુ લોકો સુધી પહોંચ્યું", "d": "૧૩.૯૪ કરોડથી વધુ યુવાનો અને ૧૦.૮૬ કરોડ મહિલાઓ સામેલ, ૩૨ લાખ શિક્ષણ સંસ્થા જોડાઈ", "body": "નવી દિલ્હી :: સામાજિક ન્યાય અને અધિકારિતા મંત્રાલયનું ‘નશા મુક્ત ભારત અભિયાન’ નશીલા પદાર્થોની માંગમાં ઘટાડો લાવવા માટેની રાષ્ટ્રીય કાર્ય યોજના (NAPDDR) અંતર્ગત અત્યાર સુધીમાં ૩૫ કરોડથી વધુ લોકો સુધી પહોંચી ચૂક્યું છે. આ અભિયાનમાં ૧૩.૯૪ કરોડથી વધુ યુવાનો અને ૧૦.૮૬ કરોડ મહિલાઓ સામેલ છે, જ્યારે આઉટરીચ પ્રવૃત્તિઓ મારફતે ૩૨ લાખથી વધુ શૈક્ષણિક સંસ્થાઓ પણ તેની સાથે જોડાઈ છે.\n\nકેન્દ્રીય ગૃહમંત્રી અમિત શાહે સપ્ટેમ્બરમાં નવી દિલ્હી ખાતે આયોજિત એન્ટી નાર્કોટિક્સ ટાસ્ક ફોર્સ (ANTF)ના વડાઓની ત્રીજી રાષ્ટ્રીય પરિષદને સંબોધતા જણાવ્યું હતું કે, ૩૧ ડિસેમ્બર ૨૦૨૯ સુધીમાં દેશ સામૂહિક રીતે ભારતમાંથી નશીલા પદાર્થોના કારોબારને જડમૂળથી ખતમ કરવામાં સફળ થશે. તેમણે પરસ્પર સંકલન, સ્પષ્ટ લક્ષ્યો, જવાબદેહી અને ડ્રગ્સ નેટવર્કને ખતમ કરવા પર ભાર મૂક્યો હતો તેમજ ૨૦૪૭ સુધીમાં ‘વિકસિત ભારત’ના રાષ્ટ્રીય વિઝન અંતર્ગત યુવાનોને નશાથી બચાવવાના મહત્વ પર પ્રકાશ પાડ્યો હતો.\n\n‘નશા મુક્ત ભારત અભિયાન’ની શરૂઆત ૧૫ ઓગસ્ટ ૨૦૨૦ના રોજ થઈ હતી. શરૂઆતમાં તેણે ૨૭૨ સંવેદનશીલ જિલ્લાઓ પર ધ્યાન કેન્દ્રિત કર્યું હતું અને હવે તેનો વિસ્તાર સમગ્ર દેશમાં થઈ ચૂક્યો છે. આ અભિયાન યુવાનો, મહિલાઓ અને સમુદાયો પર વિશેષ ધ્યાન આપે છે કારણ કે નશાના સેવનને રોકવા અને સ્વસ્થ જીવનશૈલીને પ્રોત્સાહન આપવામાં તેમની ભૂમિકા મહત્વપૂર્ણ છે.\n\nમંત્રાલયના એક વરિષ્ઠ અધિકારીએ જણાવ્યું હતું કે, આ પ્રયાસો નશા-મુક્ત સમાજના નિર્માણ માટે જાગૃતિ વધારવા અને સામૂહિક જવાબદારીને પ્રોત્સાહિત કરવા માટે નિરંતર જનભાગીદારીના મહત્વને દર્શાવે છે. શૈક્ષણિક સંસ્થાઓ, યુવા ક્લબ, મહિલા જૂથો અને સ્થાનિક સમુદાયો નશાના જોખમો અંગે માહિતી આપવા અને સમયસર પગલાં લેવા પ્રોત્સાહિત કરવા માટે મહત્વપૂર્ણ મંચનું કામ કરે છે.\n\nરાષ્ટ્રીય નશા મુક્તિ હેલ્પલાઇન ૧૪૪૪૬ એવા વ્યક્તિઓ અને પરિવારો માટે એક માધ્યમ છે જેઓ નશાના સેવન સંબંધિત સમસ્યાઓ અંગે માહિતી અને સહાય મેળવવા માંગે છે. વધુ વિગતો અને જાગૃતિ સંસાધનો https://nmba.dosje.gov.in/ પરથી મેળવી શકાય છે.", "photo": null, "cap": "કેન્દ્રીય ગૃહમંત્રી અમિત શાહ નવી દિલ્હીમાં એન્ટી નાર્કોટિક્સ ટાસ્ક ફોર્સના વડાઓની પરિષદને સંબોધિત કરતા", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326872", "sec": "health"}, {"id": "p2326873", "k": "એનએસઈ સોશિયલ સ્ટોક એક્સચેન્જ પર નવી પહેલ", "h": "કેન્દ્રીય મંત્રી જયંત ચૌધરીએ એનએસઈ સોશિયલ સ્ટોક એક્સચેન્જ પર એનએસડીસીની શરૂઆત કરાવી", "d": "નાબાર્ડે ૪ કરોડ રૂપિયાનું રોકાણ કર્યું, મધ્ય પ્રદેશના ૬૦૦ યુવાનોને વિદેશમાં રોજગારની તક મળશે", "body": "નવી દિલ્હી :: કેન્દ્રીય કૌશલ્ય વિકાસ અને ઉદ્યોગસાહસિકતા રાજ્ય મંત્રી (સ્વતંત્ર પ્રભાર) અને શિક્ષણ રાજ્ય મંત્રી જયંત ચૌધરીએ મુંબઈ સ્થિત નેશનલ સ્ટોક એક્સચેન્જ (એનએસઈ)ના સોશિયલ સ્ટોક એક્સચેન્જ (એસએસઈ) પ્લેટફોર્મ પર નેશનલ સ્કિલ ડેવલપમેન્ટ કોર્પોરેશન (એનએસડીસી)ની શરૂઆત પ્રસંગે ઘંટ વગાડવાના સમારોહમાં ભાગ લીધો હતો.\n\nઆ પ્રસંગે એનએસડીસીએ પ્રથમ વખત ઝીરો કૂપન ઝીરો પ્રિન્સિપલ (ઝેડસીઝેડપી) ઇન્સ્ટ્રુમેન્ટ્સ બહાર પાડ્યા હતા, જેમાં નેશનલ બેંક ફોર એગ્રિકલ્ચર એન્ડ રૂરલ ડેવલપમેન્ટ (નાબાર્ડ) દ્વારા નવીન કૌશલ્ય વિકાસ અને વૈશ્વિક રોજગાર પહેલ માટે ૪ કરોડ રૂપિયાનું રોકાણ કરવામાં આવ્યું છે. આ કાર્યક્રમ મધ્ય પ્રદેશના આર્થિક રીતે નબળા અન્ય પછાત વર્ગ (ઓબીસી) પરિવારોના ૬૦૦ યુવાનોને આંતરરાષ્ટ્રીય સ્તરે રોજગારની તકો મેળવવા માટે સક્ષમ બનાવશે.\n\nઆશરે ૧૧.૨૫ કરોડ રૂપિયાના અંદાજિત ખર્ચ ધરાવતા આ કાર્યક્રમમાં મિશ્ર-ધિરાણ માળખું અપનાવવામાં આવ્યું છે. તેમાં લાભાર્થીઓની ભાગીદારી ૧૫ ટકા રહેશે, ૩૫ ટકા રકમ સોશિયલ સ્ટોક એક્સચેન્જ દ્વારા એકત્રિત ભંડોળમાંથી મળશે અને બાકીની ૫૦ ટકા રકમ ઉમેદવારોના સફળ આંતરરાષ્ટ્રીય પ્લેસમેન્ટ પર મધ્ય પ્રદેશ સરકાર દ્વારા ચૂકવવામાં આવશે.\n\nએનએસડીસીના સીઈઓ અરુણકુમાર પિલ્લઈએ જણાવ્યું હતું કે, આ પહેલ અંતર્ગત ૩૦૦ ઉમેદવારોને જાપાનમાં અને અન્ય ૩૦૦ ઉમેદવારોને જર્મનીમાં રોજગાર મેળવવા માટે રહેણાંક વિદેશી ભાષા અને રોજગારક્ષમતા તાલીમ અપાશે. ઉમેદવારોને કેર ગિવિંગ, હોસ્પિટાલિટી, કન્સ્ટ્રક્શન અને મેન્યુફેક્ચરિંગ સહિતના ક્ષેત્રોમાં તૈયાર કરાશે. જાપાનમાં નોકરી મેળવનારાઓની અંદાજિત માસિક આવક આશરે ૧-૧.૨ લાખ રૂપિયા અને જર્મનીમાં ૧.૧-૩.૨ લાખ રૂપિયા રહેવાનો અંદાજ છે.\n\nઆ સમારોહમાં મધ્ય પ્રદેશના રાજ્ય મંત્રી કૃષ્ણા ગૌર, મહારાષ્ટ્રના મંત્રી મંગલ પ્રભાત લોઢા, મહારાષ્ટ્રના અધિક મુખ્ય સચિવ મનીષા વર્મા, એમએસડીઈના અધિક સચિવ મનીષા સેનશર્મા, એનએસઈના એમડી અને સીઈઓ આશિષકુમાર ચૌહાણ, નાબાર્ડના અધ્યક્ષ ડૉ. શાજી કૃષ્ણન વી. અને ડીસીએમ શ્રીરામ ઇન્ટરનેશનલ લિમિટેડના એમડી આલોક શ્રીરામ ઉપસ્થિત રહ્યા હતા.", "photo": "/media/2026-10-22/p2326873-0.jpg", "cap": "મુંબઈમાં એનએસઈ સોશિયલ સ્ટોક એક્સચેન્જ પર એનએસડીસીની શરૂઆત પ્રસંગે ઘંટ વગાડતા કેન્દ્રીય મંત્રી જયંત ચૌધરી.", "src": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2326873", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCADTATwDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QAShAAAgEDAgQCBgcEBggFBQAAAQIDAAQRBSEGEjFBE1EUImFxgZEHFTJCkqGxI1LB0TNTVHJz4RYkNENiY7LwFyU1dII2RFWT8f/EABoBAAIDAQEAAAAAAAAAAAAAAAIDAAEEBQb/xAA1EQACAQIEBAMHAwMFAAAAAAAAAQIDEQQSITETFEFRMmFxBSIzgaGx8ELB0TRS4QYVIySR/9oADAMBAAIRAxEAPwDQFsdu9At0x1FIkWYH1lHxyKQxfH2G+BBr1CsZVUg+opiNs9c0kn86Q0nrLzAjfyNBnzkqVJFR7MJNPYbl3Zf7w/WrNhgk9s1SXE80bKTErYYZ5W9tXPOGJ261zazvMeix0HPpjE/uH9RV/VDoODeMR/Vfxq+rHV3ET8QKFFRrSgbgoVIXp0pEvWhuXYao6RLIkMZeZ1RB1ZjgVHi1OwlkCJdwFz0XnAJ+dGoyaukUSl6UdEpDLlCGHmDmjqmRAoqOhQkBQoiaGahA6VjaiAzTnhnl61CxqhRkYoqhAUKFCiKBQoUKhAUKFCoQFChQqEGr7/Y5/wC436VyNvtGut33+xXH+G36VyVuta8P8N+ppwviYikPTlNvUka3sIoDrR9KApYsBG1DFH2pNEE0egZIo5Bh0VveM1Dl0jT5ft2kWfYuP0qQ8silvUyB0IoG4AZVKnJrHFyXhZjbh1KuXhnT2HqiSP8Auv8AzqHNwjE28dwfc6A1oJ5xFGGCM5PRR1oLcRE45xnbbvvvTY4mstpEdCDV7GQn4MlI9UwP81NR34f1OHpEzAfusGrdq6sAVIIPSlfCmc5U/Uk/kDwUtm0YmxtbyzfnNpKzFcEcpqcbq6A3sZfkf5VqcUMDyoHiFLeJHSb6mW9MmA3spfkf5UPT3XraS/KtRj2VGjllM5VogIznDA7jHnUVWD/T9SuE11KMaryje1lrLa79I1nZTNDb2zzsmzEHYGtbx9ey6dwfqlzbvyTLDyqw7EkD+Necm1H0eJVGC533GaOLg1dR+oSpf3MuNe1nWeIr8y+NLGjH9jArnCj+dNRcFcSyxekqM57M+9azgHSQYUvrsZeQZXP3a6JbqvLggHArNWxk07ROlSwkMt2cLmseLeHGF5F6XEY9zJbvzKB7QO3vFdb4K4uTXtBhurrC3Snkm5BsSO/syKt5oQSCF3/WofBukw6br2rJbw . વિભાગે નાણાકીય વર્ષ ૨૦૨૬-૨૭ (એપ્રિલ-સપ્ટેમ્બર ૨૦૨૬)ના પ્રથમ છમાસિક ગાળામાં ૮,૨૧૨.૭ કરોડ રૂપિયાની આવક નોંધાવી છે, જે પાછલા નાણાકીય વર્ષના સમાન ગાળામાં મેળવેલ ૬,૬૩૬ કરોડ રૂપિયાની સરખામણીએ ૨૪ ટકાનો વાર્ષિક વધારો દર્શાવે છે.\n\nકેન્દ્રીય સંચાર અને ઉત્તર પૂર્વીય ક્ષેત્ર વિકાસ મંત્રી જ્યોતિરાદિત્ય એમ. સિંધિયાની અધ્યક્ષતામાં નવી દિલ્હી ખાતે બીજી ત્રિમાસિક સમીક્ષા બેઠક યોજાઈ હતી. આ બેઠકમાં કેન્દ્રીય સંચાર અને ગ્રામીણ વિકાસ રાજ્ય મંત્રી ડૉ. ચંદ્રશેખર પેમ્માસાની, ટપાલ સચિવ સુબ્રત દાસ, ટપાલ સેવા મહાનિદેશક મનીષા સિંહા તેમજ વિવિધ સર્કલોના વરિષ્ઠ અધિકારીઓ ઉપસ્થિત રહ્યા હતા. ટપાલ વિભાગે નાણાકીય વર્ષ ૨૦૨૬-૨૭ના બીજા ક્વાર્ટરમાં (જુલાઈ-સપ્ટેમ્બર ૨૦૨૬) ૪,૨૦૧.૫ કરોડ રૂપિયાની આવક મેળવી છે, જે ગત વર્ષની સમાન ત્રિમાસિક કરતાં ૨૫ ટકા અને પ્રથમ ક્વાર્ટર કરતાં ૫ ટકા વધુ છે.\n\nવિભાગના તમામ વ્યવસાયિક ક્ષેત્રોમાં વૃદ્ધિ નોંધાઈ છે. પાર્સલ કારોબારમાં ૭૧ ટકાનો જબરદસ્ત ઉછાળો નોંધાયો હતો અને તેણે બીજા ક્વાર્ટરમાં ૩૧૮.૯ કરોડ રૂપિયાની આવક મેળવી છે. આ ઉપરાંત PLI/RPLI માં ૪૪ ટકા, ટપાલ સામગ્રીમાં ૩૬ ટકા, IR અને GB માં ૩૮ ટકા તેમજ પોસ્ટ ઓફિસ બચત બેંક (POSB) માં ૧૮ ટકા વૃદ્ધિ જોવા મળી હતી, જેમાં POSB નો ફાળો ૧,૯૮૭ કરોડ રૂપિયા રહ્યો હતો.\n\nકામગીરીની દ્રષ્ટિએ બિહાર ટપાલ સર્કલ ૯૭.૧૫ ટકા લક્ષ્ય સિદ્ધિ સાથે ટોચ પર રહ્યું હતું, જ્યારે પશ્ચિમ બંગાળ ૯૭.૦૭ ટકા અને ઉત્તર પૂર્વ સર્કલ ૯૪.૭૯ ટકા સાથે ક્રમશઃ બીજા અને ત્રીજા સ્થાને રહ્યા હતા. શ્રેષ્ઠ કામગીરી બદલ પ્રથમ ક્વાર્ટર માટે આંધ્રપ્રદેશ અને બીજા ક્વાર્ટર માટે બિહાર સર્કલનું સન્માન કરવામાં આવ્યું હતું. કુલ ૨૩ સર્કલોમાંથી ૧૮ સર્કલોએ પોતાની કામગીરીમાં સુધારો નોંધાવ્યો છે.\n\nકેન્દ્રીય મંત્રી જ્યોતિરાદિત્ય સિંધિયાએ ગ્રાહક-કેન્દ્રિત અભિગમ, વ્યાપારિક વિવિધતા, નવીનતા અને ડિજિટાઈઝેશન પર ભાર મૂકતાં જણાવ્યું હતું કે સેવાની ગુણવત્તા વધારીને આ વૃદ્ધિ જાળવી રાખવી જરૂરી છે. રાજ્ય મંત્રી ડૉ. ચંદ્રશેખર પેમ્માસાનીએ પાર્સલ વિતરણમાં વિલંબ અટકાવવા વાસ્તવિક સમયના મોનિટરિંગ અને પ્રક્રિયાઓના માનકીકરણ પર ભાર મૂક્યો હતો.", "photo": "/media/2026-10-22/p2326779-0.jpg", "cap": "નવી દિલ્હીમાં ટપાલ વિભાગની બીજી ક્વાર્ટર સમીક્ષા બેઠકમાં કેન્દ્રીય મંત્રી જ્યોતિરાદિત્ય સિંધિયા, રાજ્ય મંત્રી ડૉ     ${alertsList.map(([id,t,unread]) => `<a class="alert" href="#${id}"><span class="d ${unread ? '' : 'seen'}"></span><span><b>${esc(by[id].h)}</b><small>${unread ? '<em>તાજા</em> · ' : ''}${t} · ${esc(NAME[by[id].sec])}</small></span></a>`).join('')}`;

  document.getElementById('account').innerHTML = `<div class="name">વાચક</div><a class="pill" href="#home">ઈ-પેપર</a>
    <a class="li" href="#home">મારા સમાચાર<small>તમે અનુસરો છો તે વિભાગો</small></a><a class="li" href="#saved">સાચવેલા સમાચાર</a>
    <a class="li" href="#home">WhatsApp અને સૂચનાઓ</a><a class="li" href="#home">સંપર્ક</a>
    <div class="theme"><b>દેખાવ</b>
      <label><input type="radio" name="theme" value="auto">ઉપકરણ પ્રમાણે</label><label><input type="radio" name="theme" value="dark">ડાર્ક</label><label><input type="radio" name="theme" value="light">લાઇટ</label></div>`;
  document.querySelectorAll('input[name=theme]').forEach(r => { r.checked = r.value === store.get('ck-theme', 'dark'); r.addEventListener('change', () => { store.set('ck-theme', r.value); applyTheme(r.value); }); });

  document.getElementById('footer').innerHTML = `<div class="wm">કેપિટલ ક્રાંતિ</div>
    <div class="fcols">
      <div><b>કેપિટલ ક્રાંતિ</b><a>અમારા વિશે</a><a>સંપાદકીય નીતિ</a><a>સુધારા અને ભૂલો</a><a>કારકિર્દી</a></div>
      <div><b>વિભાગો</b>${MAIN.slice(0,6).map(([k,n]) => `<a data-sec="${k}">${n}</a>`).join('')}</div>
      <div><b>મેળવો</b><a>ઈ-પેપર</a><a>WhatsApp ચેનલ</a><a>સૂચનાઓ</a><a>જૂના અંકો</a></div>
      <div><b>સંપર્ક</b><a>સમાચાર મોકલો</a><a>જાહેરાત આપો</a><a>ભૂલ જણાવો</a><a>અમારો સંપર્ક</a></div>
      <div><b>નિયમો</b><a>ઉપયોગના નિયમો</a><a>ગોપનીયતા નીતિ</a><a>RSS</a><a>સાઇટમેપ</a></div>
    </div><p class="copy">capitalkranti.co.in © ૧૯૯૨–૨૦૨૬ કેપિટલ ક્રાંતિ, ગાંધીનગર · RNI 54922/93 · સમાચાર સ્રોત: PIB</p>`;

  /* ---------- panels ---------- */
  const panels = ['drawer','alerts','account'].map(id => document.getElementById(id)), shade = document.getElementById('shade');
  function closeAll(){ panels.forEach(p => p.hidden = true); shade.hidden = true; }
  function open(id){ closeAll(); document.getElementById(id).hidden = false; shade.hidden = false; }
  document.getElementById('menuBtn').onclick = () => { open('drawer'); setTimeout(() => document.getElementById('q').focus(), 30); };
  document.getElementById('bellBtn').onclick = () => { open('alerts'); document.getElementById('bellDot').hidden = true; };
  document.getElementById('acctBtn').onclick = () => open('account');
  shade.onclick = closeAll;
  document.getElementById('breakingClose').onclick = () => { document.getElementById('breaking').hidden = true; store.set('ck-breaking-closed', true); };
  document.getElementById('askForm').addEventListener('submit', e => { e.preventDefault(); const q = document.getElementById('q').value.trim(); if (!q) return; closeAll(); location.hash = 'q-' + encodeURIComponent(q).replace(/%/g, '_'); });

  document.addEventListener('click', e => {
    const t = e.target.closest('button, a'); if (!t) { const sm = document.getElementById('shareMenu'); if (sm) sm.hidden = true; return; }
    if (t.dataset.sec) { e.preventDefault(); closeAll(); location.hash = 'sec-' + t.dataset.sec; }
    else if (t.hasAttribute('data-home')) { closeAll(); location.hash = 'home'; }
    else if (t.hasAttribute('data-video')) { location.hash = 'home'; setTimeout(() => document.querySelector('.vtrack')?.scrollIntoView({ block: 'center' }), 60); }
    else if (t.dataset.expand) { const g = t.parentElement; g.classList.toggle('open'); g.querySelector('.sub').hidden = !g.classList.contains('open'); }
    else if (t.hasAttribute('data-share')) { const sm = document.getElementById('shareMenu'); sm.hidden = !sm.hidden; e.stopPropagation(); }
    else if (t.dataset.copy) { navigator.clipboard?.writeText(t.dataset.copy).then(() => say('લિંક કૉપી થઈ'), () => say('લિંક: ' + t.dataset.copy)); document.getElementById('shareMenu').hidden = true; }
    else if (t.dataset.save) { const list = store.get('ck-saved', []); const id = t.dataset.save; const on = !list.includes(id); store.set('ck-saved', on ? [...list, id] : list.filter(x => x !== id)); article(by[id]); say(on ? 'સમાચાર સાચવ્યા' : 'સાચવેલામાંથી કાઢ્યા'); }
    else if (t.hasAttribute('data-listen')) { say('સાંભળવાની સુવિધા: સાચી વેબસાઇટમાં ગુજરાતી અવાજ સાથે આવશે'); }
    else if (t.dataset.follow) { say(NAME[t.dataset.follow] + ' અનુસરો: સાચી વેબસાઇટમાં'); }
    else if (t.dataset.scroll) { const tr = document.getElementById('liveTrack'); tr.scrollBy({ left: Number(t.dataset.scroll) * tr.clientWidth * 0.75, behavior: 'smooth' }); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeAll(); const sm = document.getElementById('shareMenu'); if (sm) sm.hidden = true; } });
  function wireCarousel(){
    const tr = document.getElementById('liveTrack'); if (!tr) return;
    const [l, r] = document.querySelectorAll('.live .arrows button');
    const upd = () => { l.disabled = tr.scrollLeft < 4; r.disabled = tr.scrollLeft + tr.clientWidth >= tr.scrollWidth - 4; };
    tr.addEventListener('scroll', upd, { passive: true }); upd();
  }

  /* ---------- routing ---------- */
  function route(){
    const id = decodeURIComponent(location.hash.slice(1));
    document.querySelectorAll('#secnav button[data-sec]').forEach(b => b.classList.toggle('on', 'sec-' + b.dataset.sec === id));
    const isArticle = !!by[id];
    document.getElementById('masthead').hidden = isArticle;
    if (isArticle) article(by[id]);
    else if (id.startsWith('sec-') && NAME[id.slice(4)]) section(id.slice(4));
    else if (id.startsWith('q-')) search(decodeURIComponent(id.slice(2).replace(/_/g, '%')));
    else if (id === 'saved') { const ids = store.get('ck-saved', []); search(''); document.querySelector('.sechead h2').textContent = 'સાચવેલા સમાચાર';
      document.querySelector('.river').innerHTML = ids.map(i => by[i]).filter(Boolean).map(s => `<div class="it"><span class="dt">${esc(NAME[s.sec])}</span><a class="h" href="#${s.id}"><h3 class="h-l">${esc(s.h)}</h3></a><div>${img(s, '')}</div></div>`).join('') || '<p class="dek">હજી કોઈ સમાચાર સાચવ્યા નથી. સમાચારમાં “સાચવો” દબાવો.</p>';
      document.querySelector('.sublinks').innerHTML = ''; }
    else home();
    window.scrollTo(0, 0); onScroll();
  }
  function onScroll(){ const m = document.getElementById('masthead'); document.body.classList.toggle('stuck', m.hidden || window.scrollY > m.offsetTop + m.offsetHeight - 40); }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
