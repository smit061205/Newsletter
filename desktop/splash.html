<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<title>Capital Kranti</title>
<style>
  html, body { margin: 0; height: 100%; background: #f7f7f8; color: #16161d;
               font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Gujarati", "Nirmala UI", sans-serif;
               -webkit-user-select: none; -webkit-app-region: drag; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  img { width: 88px; height: 88px; }
  h1 { margin: 0; font-size: 19px; font-weight: 600; }
  p { margin: 0; color: #5f5f6b; font-size: 13px; }
  .bar { width: 160px; height: 3px; border-radius: 3px; background: #e6e6ea; overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #2f49d1;
                animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .5; } }
</style>
</head>
<body>
<main>
  <img src="icon/png/256.png" alt="">
  <h1>કેપિટલ ક્રાંતિ</h1>
  <div class="bar" role="progressbar" aria-label="Starting"></div>
  <p>ન્યૂઝરૂમ તૈયાર થઈ રહ્યો છે…</p>
</main>
</body>
</html>
