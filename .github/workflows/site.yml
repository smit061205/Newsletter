# The Capital Kranti website (site/): its own installs, typecheck and build.
# Runs only when site/ changes; the app's checks (apps.yml) skip site-only
# changes, and app releases still come only from version tags.
name: site
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build (Next.js typechecks as it builds)
        run: npm run build
      - name: Accessibility check (WCAG 2 AA on the main pages, phone and desktop, light and dark)
        env:
          CK_SAMPLE: "1"
        run: |
          npx playwright install --with-deps chromium
          npm run build
          (npx next start --port 3200 > /tmp/site.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3200/ && break; sleep 2; done
          node test/a11y.mjs http://localhost:3200
