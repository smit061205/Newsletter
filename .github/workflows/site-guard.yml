# Keeps website work and app work apart (CLAUDE.md: the app is never changed
# for the website). Fails, on any branch or pull request, when:
#   1. one commit changes the website and the app together;
#   2. a website branch (names below) changes anything outside the website.
# The website: site/, docs/website/, .github/workflows/site*.yml. The shared
# notes CLAUDE.md and HANDOFF.md belong to both. Everything else is the app's.
# App-only commits always pass, so the app's own work is never held up.
name: site-guard
on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # website branches: site/..., site-..., and the cloud website session's own
      WEBSITE_BRANCHES: "^(site/|site-|claude/blissful-newton-qao5ww$)"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # the filters below end "false" on a file of the other kind; that isn't a failure
          set +e
          kind() {
            case "$1" in
              site/*|docs/website/*|.github/workflows/site*.yml|.github/workflows/site*.yaml) echo site ;;
              CLAUDE.md|HANDOFF.md) echo notes ;;
              *) echo app ;;
            esac
          }
          # the commits this push or pull request brings
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$PR_BASE" HEAD)
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=$(git merge-base origin/main HEAD)
          fi
          echo "checking $(git rev-list --count --no-merges "$base..HEAD") commit(s) after ${base:0:7} on $BRANCH"
          bad=0
          for c in $(git rev-list --no-merges "$base..HEAD"); do
            files=$(git diff-tree --no-commit-id --name-only -r "$c")
            site=$(for f in $files; do [ "$(kind "$f")" = site ] && echo "$f"; done)
            app=$(for f in $files; do [ "$(kind "$f")" = app ] && echo "$f"; done)
            if [ -n "$site" ] && [ -n "$app" ]; then
              echo "::error::commit ${c:0:7} ($(git log -1 --format=%s "$c")) changes the website and the app together. App files in it:"
              echo "$app" | sed 's/^/    /'
              bad=1
            fi
          done
          if echo "$BRANCH" | grep -Eq "$WEBSITE_BRANCHES"; then
            # against where it left main, so main merged into it doesn't count
            app=$(for f in $(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD); do [ "$(kind "$f")" = app ] && echo "$f"; done)
            if [ -n "$app" ]; then
              echo "::error::$BRANCH is a website branch but changes the app:"
              echo "$app" | sed 's/^/    /'
              bad=1
            fi
          fi
          [ $bad = 0 ] && echo "ok: the website and the app are kept apart"
          exit $bad
