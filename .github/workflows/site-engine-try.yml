# The engine checked without touching the website: its typecheck and self-test,
# every source asked from GitHub's servers (probe.ts), and a dry run that writes
# the top few real events of the moment and prints them, storing nothing (try.ts).
# On every push that changes the engine, on any branch, and by hand.
name: site-engine-try
on:
  push:
    paths: ["site/engine/**", "site/lib/**", ".github/workflows/site-engine*.yml"]
  workflow_dispatch:
    inputs:
      stories:
        description: "How many events to write in the dry run"
        default: "3"

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm ci --prefix site --no-audit --no-fund
      - name: Typecheck
        run: npx --prefix site tsc -p site/engine
      - name: Self-test
        run: node --experimental-strip-types --no-warnings site/engine/selftest.ts
      - name: Every source, from GitHub's servers
        run: node --experimental-strip-types --no-warnings site/engine/probe.ts
      - name: The free AI routes, one small question each
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
        run: node --experimental-strip-types --no-warnings site/engine/aiprobe.ts
      - name: Dry run (stores nothing)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
        run: node --experimental-strip-types --no-warnings site/engine/try.ts ${{ github.event.inputs.stories || '3' }}
