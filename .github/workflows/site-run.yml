# The website's hourly run (site/pipeline/run.ts): records how late GitHub
# starts it, checks that PIB, the CM's office and All India Radio answer
# GitHub's servers, and gives new stories their sections and English versions
# with a free model. Every hour at minute 7, and on a push that changes it.
name: site-run
on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths: ["site/pipeline/**", "site/lib/**", ".github/workflows/site-run.yml"]
  workflow_dispatch:

concurrency:
  group: site-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # the engine's checks it borrows (the number check, the paper's profile) need the root installs
      - name: Install
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm ci --no-audit --no-fund --prefix site
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CK_EVENT: ${{ github.event_name }}
        run: node --experimental-strip-types --no-warnings site/pipeline/run.ts
