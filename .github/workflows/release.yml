# The desktop app's installers: a .dmg for Macs (Apple silicon and Intel) and
# a setup .exe for Windows, built here and attached to a GitHub Release.
# Making one needs no Terminal: on GitHub, Releases -> Draft a new release ->
# a new tag such as v1.0.1 -> Publish release; the installers appear on it in
# about half an hour. (Run by hand from Actions: a test build, not released.)
# The app checks the latest Release for updates, so a release reaches the
# paper's computer by itself.
name: release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple silicon
            arch: arm64
          - os: macos-15-intel   # Intel
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The engine and the newsroom
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p backend
          npm run build --prefix web
          # Chromium for laying out pages, inside the packages (the app carries it)
          PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium
          # nothing the app doesn't need
          npm prune --omit=dev --no-audit --no-fund
      - name: The version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: Gather what the app carries
        run: node desktop/stage.mjs
      - name: The app starts the engine and the newsroom inside Electron's own Node
        shell: bash
        working-directory: desktop
        env:
          ELECTRON_RUN_AS_NODE: "1"
          DATA_DIR: ${{ runner.temp }}/ck-app
          PLAYWRIGHT_BROWSERS_PATH: "0"
          CK_PUBLICATION: dev-test
        run: |
          npm install --no-audit --no-fund
          E=$(node -p "require('electron')")
          cd app-engine
          "$E" --experimental-strip-types --experimental-sqlite --no-warnings --import ./engine-hooks.mjs backend/src/cli.ts serve --port 4000 &
          for i in $(seq 60); do curl -fsS http://127.0.0.1:4000/healthz 2>/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4000/api/status
          (cd web && NEWSROOM=1 "$E" node_modules/next/dist/bin/next start --port 3000 --hostname 127.0.0.1 2>/dev/null || NEWSROOM=1 "$E" ../node_modules/next/dist/bin/next start --port 3000 --hostname 127.0.0.1) &
          for i in $(seq 90); do curl -fsS -o /dev/null http://127.0.0.1:3000/newsroom && break; sleep 1; done
          curl -fsS -o /dev/null -w "newsroom %{http_code}\n" http://127.0.0.1:3000/newsroom
          kill $(jobs -p) || true
      - name: Build the installer
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the "Connect the website" sign-in, when the repository has one (README)
          CK_GITHUB_CLIENT_ID: ${{ vars.CK_GITHUB_CLIENT_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          node -e "const f='main.js',s=require('fs');s.writeFileSync(f,s.readFileSync(f,'utf8').replace('process.env.CK_GITHUB_CLIENT_ID || \"\"',JSON.stringify(process.env.CK_GITHUB_CLIENT_ID||'')))"
          if [ "${{ runner.os }}" = "macOS" ]; then A="--mac --${{ matrix.arch }}"; else A="--win --x64"; fi
          npx electron-builder $A --publish never
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # latest.yml and the blockmap let the Windows app update itself; the Macs' zip, theirs
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" --clobber --repo "$GITHUB_REPOSITORY" dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: capital-kranti-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.yml
          if-no-files-found: error
