# Publishes Aavtikal's articles from site/pipeline/features (site/pipeline/features.ts):
# runs when those files change; an article already on the website is left alone.
name: site-features
on:
  push:
    branches: [main]
    paths: ["site/pipeline/features/**", "site/pipeline/features.ts", ".github/workflows/site-features.yml"]
  workflow_dispatch:

concurrency:
  group: site-features
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund --prefix site
      - name: Publish
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node --experimental-strip-types --no-warnings site/pipeline/features.ts
      # the website's new build may still be deploying: renew its pages once it's up
      - name: Refresh the website
        run: |
          sleep 240
          curl -s -X POST https://capital-kranti.vercel.app/api/refresh || true
