# Aavtikal's desk (site/engine/desk.ts): deep explainers for AI, Tech and Science, written by
# Gemini Flash, checked and translated by Gemma; 10 a day (more on the days site/lib/config.ts names).
# Like the news engine's keeper, one job works for almost six hours: the desk writes for up to 25
# minutes at a time, and rests 30 minutes once the day's articles are done or Flash's free requests
# are used up; then it queues the next job. The hourly schedule revives it if a job ever dies.
name: site-desk
on:
  schedule: [{ cron: "37 * * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/site-desk.yml"]

permissions:
  contents: read
  actions: write

concurrency:
  group: site-desk
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Write, for almost six hours
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$(( $(date +%s) + 340 * 60 ))
          installed=""
          while [ $(( end - $(date +%s) )) -gt 600 ]; do
            git fetch -q --depth 1 origin main && git reset -q --hard origin/main
            locks=$(cat package-lock.json site/package-lock.json | sha256sum)
            if [ "$locks" != "$installed" ]; then
              npm ci --no-audit --no-fund --ignore-scripts && npm ci --prefix site --no-audit --no-fund && installed=$locks
            fi
            left=$(( end - $(date +%s) )); budget=$(( left < 1500 ? left : 1500 ))
            echo "::group::Desk, $(date -u +%H:%M) UTC"
            code=0
            timeout $(( budget + 120 )) node --experimental-strip-types --no-warnings site/engine/desk.ts $budget || code=$?
            echo "::endgroup::"
            if [ "$code" -eq 3 ]; then sleep 1800; elif [ "$code" -ne 0 ]; then echo "::warning::the desk failed ($code)"; sleep 300; fi
          done
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/site-desk.yml/dispatches" -d '{"ref":"main"}' \
            || echo "::warning::couldn't queue the next desk; the hourly schedule will"
